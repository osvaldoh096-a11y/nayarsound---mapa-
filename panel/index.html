<body>
<a class="saltar" href="#vista">Ir al contenido</a>
<div class="app">
  <aside class="lateral" aria-label="Navegación">
    <a class="marca" href="#/inicio"><span class="marca-logo" aria-hidden="true"></span><span>Panel<small>personal</small></span></a>
    <nav class="menu" id="menu"></nav>
    <div class="lateral-pie">
      <a class="menu-item" href="#/fuentes" data-ruta="fuentes" id="menu-ajustes"></a>
      <div class="usuario"><span class="avatar" aria-hidden="true">O</span><span><b>Osvaldo</b><small id="usuario-estado">Panel personal</small></span></div>
    </div>
  </aside>
  <div class="principal">
    <header class="cabecera">
      <div class="cabecera-texto">
        <h1 id="titulo-cabecera">Tu día, en un vistazo.</h1>
        <p id="fecha-cabecera"></p>
      </div>
      <div class="cabecera-acciones">
        <span id="estado-lectura" class="estado-conexion" aria-live="polite"></span>
        <button id="btn-privado" class="boton boton-icono" data-accion="privado" aria-pressed="false" title="Ocultar importes" aria-label="Ocultar importes"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="btn-actualizar" class="boton boton-primario" data-accion="actualizar" disabled>
          <span id="icono-actualizar"></span><span id="btn-actualizar-texto">Actualizar</span>
        </button>
      </div>
    </header>
    <div id="aviso-global"></div>
    <main id="vista" tabindex="-1"></main>
  </div>
</div>
<nav class="pestanas-movil" id="menu-movil" aria-label="Secciones"></nav>
<dialog id="detalle" aria-label="Detalle">
  <div class="detalle-marco">
    <button class="detalle-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <div id="detalle-cuerpo"></div>
  </div>
</dialog>
<noscript><p class="noscript">El panel necesita JavaScript.</p></noscript>
