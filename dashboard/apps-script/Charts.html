<script>
/*
 * NayarSound · Dashboard — gráficas SVG sin dependencias externas.
 * Línea (evolución), barras horizontales (comparación por ciudad) y columnas
 * apiladas (meses × ciudad). Los textos se insertan con textContent.
 */
var NSCharts = (function () {
  'use strict';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs, parent) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function div(cls, text) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  var measureCtx = null;
  function textWidth(text, size, weight) {
    measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
    measureCtx.font = (weight || 400) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    return measureCtx.measureText(String(text)).width;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function niceStep(span, count) {
    var raw = span / Math.max(1, count);
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return step * mag;
  }
  function ticks(min, max, count, integer) {
    if (min === max) { if (max === 0) max = 1; else if (max > 0) min = 0; else max = 0; }
    var step = niceStep(max - min, count);
    if (integer) step = Math.max(1, Math.round(step));
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    var out = [];
    for (var v = lo; v <= hi + step / 2; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : v);
    return out;
  }

  // ---------- Tooltip compartido ----------
  var tipEl = null;
  function tip() { return tipEl || (tipEl = document.getElementById('tooltip')); }
  function showTip(clientX, clientY, title, rows, note) {
    var t = tip();
    if (!t) return;
    t.textContent = '';
    t.appendChild(div('tip-title', title));
    rows.forEach(function (r) {
      var row = div('tip-row');
      var key = div('tip-key' + (r.kind === 'rect' ? ' rect' : ''));
      key.style.background = r.color;
      if (r.color) row.appendChild(key);
      var strong = document.createElement('strong');
      strong.textContent = r.value;
      row.appendChild(strong);
      var label = document.createElement('span');
      label.textContent = r.label;
      row.appendChild(label);
      t.appendChild(row);
    });
    if (note) t.appendChild(div('tip-note', note));
    t.hidden = false;
    var w = t.offsetWidth, h = t.offsetHeight;
    var x = clientX + 14, y = clientY + 14;
    if (x + w > window.innerWidth - 8) x = clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = clientY - h - 14;
    t.style.left = Math.max(8, x) + 'px';
    t.style.top = Math.max(8, y) + 'px';
  }
  function hideTip() { var t = tip(); if (t) t.hidden = true; }

  function legend(host, items, kind) {
    if (items.length < 2) return;
    var lg = div('legend');
    items.forEach(function (it) {
      var item = div('legend-item');
      var sw = document.createElement('span');
      sw.className = kind === 'line' ? 'legend-line' : 'legend-rect';
      sw.style.background = it.color;
      item.appendChild(sw);
      item.appendChild(document.createTextNode(it.name));
      lg.appendChild(item);
    });
    host.appendChild(lg);
  }

  function empty(host, message) {
    host.textContent = '';
    host.appendChild(div('chart-empty', message || 'Sin datos para este filtro.'));
  }

  function hasValue(v) { return v !== null && v !== undefined && isFinite(v); }

  /**
   * Interacción por posición en X (línea y columnas): el puntero o las flechas
   * eligen un índice; el tooltip lista todas las series de ese índice.
   */
  function indexInteraction(svg, hit, n, xOf, onMove, onLeave, onSelect) {
    var current = -1;
    function fromClient(clientX) {
      var r = svg.getBoundingClientRect();
      var px = clientX - r.left;
      var best = 0, dist = Infinity;
      for (var i = 0; i < n; i++) {
        var d = Math.abs(xOf(i) - px);
        if (d < dist) { dist = d; best = i; }
      }
      return best;
    }
    function anchor(i) {
      var r = svg.getBoundingClientRect();
      return { x: r.left + xOf(i), y: r.top + 24 };
    }
    hit.addEventListener('pointermove', function (ev) {
      current = fromClient(ev.clientX);
      onMove(current, ev.clientX, ev.clientY);
    });
    hit.addEventListener('pointerleave', function () { current = -1; onLeave(); });
    hit.addEventListener('click', function (ev) {
      var i = fromClient(ev.clientX);
      if (onSelect) onSelect(i);
    });
    hit.addEventListener('focus', function () {
      if (current < 0) current = n - 1;
      var a = anchor(current);
      onMove(current, a.x, a.y);
    });
    hit.addEventListener('blur', function () { onLeave(); });
    hit.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        current = clamp((current < 0 ? n - 1 : current) + (ev.key === 'ArrowLeft' ? -1 : 1), 0, n - 1);
        var a = anchor(current);
        onMove(current, a.x, a.y);
      } else if ((ev.key === 'Enter' || ev.key === ' ') && onSelect && current >= 0) {
        ev.preventDefault();
        onSelect(current);
      }
    });
  }

  function xLabels(svg, labels, xOf, y, plotWidth) {
    var n = labels.length;
    var widest = 0;
    labels.forEach(function (l) { widest = Math.max(widest, textWidth(l, 11)); });
    var slots = Math.max(1, Math.floor(plotWidth / (widest + 12)));
    var step = Math.ceil(n / slots);
    labels.forEach(function (lab, i) {
      if (i % step !== 0) return;
      var t = svgEl('text', { x: xOf(i), y: y, 'text-anchor': 'middle', 'class': 'axis-text' }, svg);
      t.textContent = lab;
    });
  }

  function yAxis(svg, ticksList, yOf, left, right, format) {
    ticksList.forEach(function (v) {
      svgEl('line', { x1: left, x2: right, y1: yOf(v), y2: yOf(v), 'class': v === 0 ? 'axis-line' : 'grid-line' }, svg);
      var t = svgEl('text', { x: left - 8, y: yOf(v), 'text-anchor': 'end', 'dominant-baseline': 'middle', 'class': 'axis-text' }, svg);
      t.textContent = format(v);
    });
  }

  // ---------------------------------------------------------------------------
  // Línea: evolución por mes/semana. spec.series[].values admite null (sin dato).
  // ---------------------------------------------------------------------------
  function line(host, spec) {
    host.textContent = '';
    var n = spec.labels.length;
    var any = spec.series.some(function (s) { return s.values.some(hasValue); });
    if (!n || !any) return empty(host, spec.emptyMessage);
    legend(host, spec.series, 'line');

    var width = Math.max(280, host.clientWidth);
    var height = spec.height || 260;
    var vals = [];
    spec.series.forEach(function (s) { s.values.forEach(function (v) { if (hasValue(v)) vals.push(v); }); });
    var yt = ticks(Math.min(0, Math.min.apply(null, vals)), Math.max(0, Math.max.apply(null, vals)), 4);
    var yMin = yt[0], yMax = yt[yt.length - 1];
    var axisW = 0;
    yt.forEach(function (v) { axisW = Math.max(axisW, textWidth(spec.formatAxis(v), 11)); });

    // Etiqueta directa al final de cada serie, solo si no chocan entre sí.
    var ends = spec.series.map(function (s) {
      for (var i = s.values.length - 1; i >= 0; i--) if (hasValue(s.values[i])) return { i: i, v: s.values[i], s: s };
      return null;
    }).filter(Boolean);
    var endW = 0;
    ends.forEach(function (e) { endW = Math.max(endW, textWidth(spec.formatAxis(e.v), 12)); });
    var m = { top: 12, right: endW + 14, bottom: 26, left: axisW + 12 };
    var pw = Math.max(40, width - m.left - m.right);
    var ph = height - m.top - m.bottom;
    var xOf = function (i) { return m.left + (n === 1 ? pw / 2 : i * pw / (n - 1)); };
    var yOf = function (v) { return m.top + (yMax - v) / (yMax - yMin) * ph; };

    var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height, 'class': 'chart-svg', role: 'img', 'aria-label': spec.ariaLabel || '' });
    host.appendChild(svg);
    yAxis(svg, yt, yOf, m.left, m.left + pw, spec.formatAxis);
    xLabels(svg, spec.labels, xOf, height - 6, pw);

    var surface = cssVar('--surface');
    // El periodo en curso (cifras parciales) se dibuja atenuado y con punto hueco,
    // para que una caída por datos incompletos no parezca un resultado cerrado.
    var partial = spec.partialIndex;
    var dot = function (s, i, v) {
      var hollow = i === partial;
      svgEl('circle', { cx: xOf(i), cy: yOf(v), r: 4, fill: hollow ? surface : s.color, stroke: hollow ? s.color : surface, 'stroke-width': 2 }, svg);
    };
    spec.series.forEach(function (s) {
      var d = '', pen = false;
      s.values.forEach(function (v, i) {
        if (!hasValue(v) || i === partial) { pen = false; return; }
        d += (pen ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(v).toFixed(1) + ' ';
        pen = true;
      });
      var line = { fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
      if (d) svgEl('path', Object.assign({ d: d }, line), svg);
      if (partial > 0 && hasValue(s.values[partial]) && hasValue(s.values[partial - 1])) {
        svgEl('path', Object.assign({
          d: 'M' + xOf(partial - 1) + ' ' + yOf(s.values[partial - 1]) + ' L' + xOf(partial) + ' ' + yOf(s.values[partial]),
          'stroke-opacity': 0.4
        }, line), svg);
      }
      s.values.forEach(function (v, i) {
        var lone = hasValue(v) && !hasValue(s.values[i - 1]) && !hasValue(s.values[i + 1]);
        if (!hasValue(v) || (n > 18 && !lone && i !== partial)) return;
        dot(s, i, v);
      });
    });

    var ys = ends.map(function (e) { return yOf(e.v); }).sort(function (a, b) { return a - b; });
    var collide = false;
    for (var k = 1; k < ys.length; k++) if (ys[k] - ys[k - 1] < 15) collide = true;
    ends.forEach(function (e) {
      dot(e.s, e.i, e.v);
      if (collide) return;
      var t = svgEl('text', { x: xOf(e.i) + 8, y: yOf(e.v), 'dominant-baseline': 'middle', 'class': 'value-text' }, svg);
      t.textContent = spec.formatAxis(e.v);
    });

    var cross = svgEl('line', { x1: 0, x2: 0, y1: m.top, y2: m.top + ph, 'class': 'crosshair', visibility: 'hidden' }, svg);
    var hit = svgEl('rect', { x: m.left - 8, y: m.top, width: pw + 16, height: ph, fill: 'transparent', 'class': 'chart-hit', tabindex: 0, role: 'button', 'aria-label': (spec.ariaLabel || '') + '. Usa las flechas para recorrer y Enter para ver el desglose.' }, svg);
    indexInteraction(svg, hit, n, xOf, function (i, cx, cy) {
      cross.setAttribute('x1', xOf(i)); cross.setAttribute('x2', xOf(i)); cross.setAttribute('visibility', 'visible');
      showTip(cx, cy, spec.fullLabels[i], spec.series.map(function (s) {
        var v = s.values[i];
        return { color: s.color, value: hasValue(v) ? spec.format(v) : 'Sin datos', label: s.name };
      }), spec.noteFor ? spec.noteFor(i) : null);
    }, function () { cross.setAttribute('visibility', 'hidden'); hideTip(); }, spec.onSelect);
  }

  // ---------------------------------------------------------------------------
  // Barras horizontales: una barra por ciudad (admite negativos y «No disponible»).
  // ---------------------------------------------------------------------------
  function barPath(x0, x1, y, h) {
    var w = Math.abs(x1 - x0);
    var r = Math.min(4, w / 2, h / 2);
    if (w < 0.5) return '';
    if (x1 >= x0) {
      return 'M' + x0 + ',' + y + ' H' + (x1 - r) + ' A' + r + ',' + r + ' 0 0 1 ' + x1 + ',' + (y + r) +
        ' V' + (y + h - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x1 - r) + ',' + (y + h) + ' H' + x0 + ' Z';
    }
    return 'M' + x0 + ',' + y + ' H' + (x1 + r) + ' A' + r + ',' + r + ' 0 0 0 ' + x1 + ',' + (y + r) +
      ' V' + (y + h - r) + ' A' + r + ',' + r + ' 0 0 0 ' + (x1 + r) + ',' + (y + h) + ' H' + x0 + ' Z';
  }

  function hbar(host, spec) {
    host.textContent = '';
    var rows = spec.rows;
    if (!rows.length || !rows.some(function (r) { return r.value !== null && r.value !== undefined; })) {
      return empty(host, spec.emptyMessage);
    }
    var width = Math.max(280, host.clientWidth);
    var rowH = 40, barH = 20;
    var height = rows.length * rowH + 8;
    var labelW = 0, valueW = 0;
    rows.forEach(function (r) {
      labelW = Math.max(labelW, textWidth(r.label, 12));
      valueW = Math.max(valueW, textWidth(hasValue(r.value) ? spec.format(r.value) : 'No disponible', 12));
    });
    labelW = Math.min(labelW + 14, width * 0.35);
    valueW += 10;
    var vals = rows.filter(function (r) { return hasValue(r.value); }).map(function (r) { return r.value; });
    var lo = Math.min(0, Math.min.apply(null, vals));
    var hi = Math.max(0, Math.max.apply(null, vals));
    if (lo === hi) hi = 1;
    var left = labelW + (lo < 0 ? valueW : 0);
    var right = width - valueW;
    var xOf = function (v) { return left + (v - lo) / (hi - lo) * (right - left); };
    var x0 = xOf(0);

    var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height, 'class': 'chart-svg', role: 'list', 'aria-label': spec.ariaLabel || '' });
    host.appendChild(svg);
    svgEl('line', { x1: x0, x2: x0, y1: 2, y2: height - 4, 'class': 'axis-line' }, svg);

    rows.forEach(function (r, i) {
      var y = i * rowH + 4;
      var g = svgEl('g', { 'class': 'bar-row', tabindex: 0, role: 'listitem', 'aria-label': r.label + ': ' + (hasValue(r.value) ? spec.format(r.value) : 'No disponible') }, svg);
      var band = svgEl('rect', { x: 0, y: y, width: width, height: rowH - 4, rx: 6, fill: 'transparent', 'class': 'bar-hit' }, g);
      var lt = svgEl('text', { x: 0, y: y + rowH / 2 - 2, 'dominant-baseline': 'middle', 'class': 'label-text' }, g);
      lt.textContent = r.label;
      var by = y + (rowH - 4 - barH) / 2;
      if (hasValue(r.value)) {
        var x1 = xOf(r.value);
        var d = barPath(x0, x1, by, barH);
        if (d) svgEl('path', { d: d, fill: r.color }, g);
        var vt = svgEl('text', {
          x: r.value >= 0 ? x1 + 6 : x1 - 6, y: by + barH / 2, 'dominant-baseline': 'middle',
          'text-anchor': r.value >= 0 ? 'start' : 'end', 'class': 'value-text'
        }, g);
        vt.textContent = spec.format(r.value);
      } else {
        var na = svgEl('text', { x: x0 + 6, y: by + barH / 2, 'dominant-baseline': 'middle', 'class': 'na-text' }, g);
        na.textContent = r.naText || 'No disponible';
      }
      var show = function (cx, cy) {
        band.setAttribute('fill', cssVar('--surface-2'));
        showTip(cx, cy, r.label, [{ color: r.color, kind: 'rect', value: hasValue(r.value) ? spec.format(r.value) : 'No disponible', label: spec.valueLabel || '' }]
          .concat(r.extra || []), r.note || null);
      };
      var hide = function () { band.setAttribute('fill', 'transparent'); hideTip(); };
      g.addEventListener('pointermove', function (ev) { show(ev.clientX, ev.clientY); });
      g.addEventListener('pointerleave', hide);
      g.addEventListener('focus', function () { var b = g.getBoundingClientRect(); show(b.left + labelW, b.top + 8); });
      g.addEventListener('blur', hide);
      if (spec.onSelect) {
        g.style.cursor = 'pointer';
        g.addEventListener('click', function () { spec.onSelect(r.key); });
        g.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); spec.onSelect(r.key); }
        });
      }
    });
  }

  // ---------------------------------------------------------------------------
  // Columnas apiladas: periodo × ciudad. Solo apila valores positivos.
  // ---------------------------------------------------------------------------
  function topRoundedPath(x, yTop, w, yBottom) {
    var h = yBottom - yTop;
    var r = Math.min(4, w / 2, h);
    return 'M' + x + ',' + yBottom + ' V' + (yTop + r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x + r) + ',' + yTop +
      ' H' + (x + w - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (yTop + r) + ' V' + yBottom + ' Z';
  }

  function columns(host, spec) {
    host.textContent = '';
    var n = spec.labels.length;
    var totals = [];
    for (var i = 0; i < n; i++) {
      var sum = 0;
      spec.series.forEach(function (s) { var v = s.values[i]; if (hasValue(v) && v > 0) sum += v; });
      totals.push(sum);
    }
    if (!n || !totals.some(function (t) { return t > 0; })) return empty(host, spec.emptyMessage);
    legend(host, spec.series.filter(function (s) { return s.values.some(function (v) { return v > 0; }); }), 'rect');

    var width = Math.max(280, host.clientWidth);
    var height = spec.height || 260;
    var yt = ticks(0, Math.max.apply(null, totals), 4, spec.integer);
    var yMax = yt[yt.length - 1];
    var axisW = 0;
    yt.forEach(function (v) { axisW = Math.max(axisW, textWidth(spec.formatAxis(v), 11)); });
    var m = { top: 18, right: 8, bottom: 26, left: axisW + 12 };
    var pw = width - m.left - m.right;
    var ph = height - m.top - m.bottom;
    var band = pw / n;
    var colW = Math.max(3, Math.min(24, band * 0.62));
    var xOf = function (i) { return m.left + band * i + band / 2; };
    var yOf = function (v) { return m.top + (yMax - v) / yMax * ph; };

    var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height, 'class': 'chart-svg', role: 'img', 'aria-label': spec.ariaLabel || '' });
    host.appendChild(svg);
    var hover = svgEl('rect', { x: 0, y: m.top, width: band, height: ph, 'class': 'hover-band', visibility: 'hidden' }, svg);
    yAxis(svg, yt, yOf, m.left, m.left + pw, spec.formatAxis);
    xLabels(svg, spec.labels, xOf, height - 6, pw);

    var gap = 2;
    var showCaps = band >= 30;
    for (var c = 0; c < n; c++) {
      var base = 0;
      var x = xOf(c) - colW / 2;
      var lastSeries = -1;
      spec.series.forEach(function (s, si) { if (s.values[c] > 0) lastSeries = si; });
      spec.series.forEach(function (s, si) {
        var v = s.values[c];
        if (!(v > 0)) return;
        var yBottom = yOf(base) - (base > 0 ? gap : 0);
        var yTop = yOf(base + v);
        base += v;
        if (yBottom - yTop < 0.5) return;
        if (si === lastSeries) svgEl('path', { d: topRoundedPath(x, yTop, colW, yBottom), fill: s.color }, svg);
        else svgEl('rect', { x: x, y: yTop, width: colW, height: yBottom - yTop, fill: s.color }, svg);
      });
      if (showCaps && totals[c] > 0) {
        var cap = spec.formatCap ? spec.formatCap(totals[c]) : spec.formatAxis(totals[c]);
        if (textWidth(cap, 11) <= band - 2) {
          var t = svgEl('text', { x: xOf(c), y: yOf(totals[c]) - 5, 'text-anchor': 'middle', 'class': 'axis-text' }, svg);
          t.textContent = cap;
        }
      }
    }

    var hit = svgEl('rect', { x: m.left, y: m.top, width: pw, height: ph, fill: 'transparent', 'class': 'chart-hit', tabindex: 0, role: 'button', 'aria-label': (spec.ariaLabel || '') + '. Usa las flechas para recorrer y Enter para ver el desglose.' }, svg);
    indexInteraction(svg, hit, n, xOf, function (i, cx, cy) {
      hover.setAttribute('x', xOf(i) - band / 2);
      hover.setAttribute('visibility', 'visible');
      var rows = spec.series
        .filter(function (s) { return hasValue(s.values[i]) && s.values[i] !== 0; })
        .map(function (s) { return { color: s.color, kind: 'rect', value: spec.format(s.values[i]), label: s.name }; });
      rows.push({ color: null, value: spec.format(totals[i]), label: 'Total' });
      showTip(cx, cy, spec.fullLabels[i], rows, spec.noteFor ? spec.noteFor(i) : null);
    }, function () { hover.setAttribute('visibility', 'hidden'); hideTip(); }, spec.onSelect);
  }

  return { line: line, hbar: hbar, columns: columns, cssVar: cssVar, hideTip: hideTip };
})();
</script>
