{% extends "base.html" %}
{% block title %}{{ 'Editar' if competitor else 'Nuevo' }} competidor{% endblock %}
{% block content %}
  {% set c = values or competitor %}
  <div class="page-header">
    <h1>{{ 'Editar competidor' if competitor else 'Nuevo competidor' }}</h1>
  </div>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" class="form">
    <label>
      Nombre *
      <input type="text" name="name" required value="{{ c.name if c else '' }}">
    </label>
    <label>
      Ciudad
      <input type="text" name="city" value="{{ c.city if c else '' }}">
    </label>
    <label>
      Categoría
      <input type="text" name="category" value="{{ c.category if c else '' }}">
    </label>
    <label>
      Página de Facebook (URL)
      <input type="url" name="facebook_page" value="{{ c.facebook_page if c else '' }}">
    </label>
    <label>
      URL de Meta Ads Library
      <input type="url" name="ads_library_url" value="{{ c.ads_library_url if c else '' }}">
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn" href="{{ url_for('index') }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
