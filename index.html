  // ================= OPTIMIZAR ASIGNACIONES (independiente de DJ CERCANO) =================
  // Analiza eventos FUTUROS ya cargados en memoria (allEvents) y sugiere reacomodos de
  // DJ que reduzcan la distancia total, respetando disponibilidad por día y ciudad.
  // Solo analiza y recomienda — nunca escribe en Google Sheets.

  var MIN_REASSIGNMENT_SAVING_KM = 3; // umbral mínimo de ahorro para recomendar un cambio

  function todayLocalMidnight(){
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function formatDateEs(d){
    return d.getDate() + ' ' + MONTH_NAMES_ES[d.getMonth()] + ' ' + d.getFullYear();
  }

  // Algoritmo húngaro (Kuhn-Munkres) para asignación de costo mínimo. Soporta matrices
  // rectangulares rellenando con filas/columnas ficticias de costo 0 (técnica estándar:
  // nunca desplaza una asignación real porque emparejar con un "fantasma" siempre cuesta
  // 0). assignment[fila] = columna, o -1 si esa fila queda sin pareja real (solo posible
  // si hay más eventos que DJs disponibles ese día en esa ciudad). Verificado contra
  // fuerza bruta en 500 matrices aleatorias antes de integrarlo aquí.
  function hungarianMinCost(costMatrix){
    var n = costMatrix.length;
    if (n === 0) return { assignment: [], totalCost: 0 };
    var m = costMatrix[0].length;
    var size = Math.max(n, m);
    var INF = Infinity;

    var a = [];
    for (var i = 0; i <= size; i++) a.push(new Array(size + 1).fill(0));
    for (i = 1; i <= n; i++){
      for (var j = 1; j <= m; j++){ a[i][j] = costMatrix[i - 1][j - 1]; }
    }

    var u = new Array(size + 1).fill(0);
    var v = new Array(size + 1).fill(0);
    var p = new Array(size + 1).fill(0);
    var way = new Array(size + 1).fill(0);

    for (i = 1; i <= size; i++){
      p[0] = i;
      var j0 = 0;
      var minv = new Array(size + 1).fill(INF);
      var used = new Array(size + 1).fill(false);
      do {
        used[j0] = true;
        var i0 = p[j0], delta = INF, j1 = -1;
        for (j = 1; j <= size; j++){
          if (!used[j]){
            var cur = a[i0][j] - u[i0] - v[j];
            if (cur < minv[j]){ minv[j] = cur; way[j] = j0; }
            if (minv[j] < delta){ delta = minv[j]; j1 = j; }
          }
        }
        for (j = 0; j <= size; j++){
          if (used[j]){ u[p[j]] += delta; v[j] -= delta; }
          else { minv[j] -= delta; }
        }
        j0 = j1;
      } while (p[j0] !== 0);

      do {
        j1 = way[j0];
        p[j0] = p[j1];
        j0 = j1;
      } while (j0);
    }

    var assignment = new Array(n).fill(-1);
    var totalCost = 0;
    for (j = 1; j <= size; j++){
      if (p[j] >= 1 && p[j] <= n && j <= m){
        assignment[p[j] - 1] = j - 1;
        totalCost += costMatrix[p[j] - 1][j - 1];
      }
    }
    return { assignment: assignment, totalCost: totalCost };
  }

  // Agrupa los eventos futuros (dentro del período elegido) por fecha + ciudad.
  // Reutiliza allEvents tal cual está en memoria — ninguna consulta nueva a Sheets.
  function getFutureEventGroups(periodDays){
    var today = todayLocalMidnight();
    var endDate = new Date(today);
    endDate.setDate(endDate.getDate() + periodDays);

    var future = allEvents.filter(function(e){
      return e.date && e.date.getTime() >= today.getTime() && e.date.getTime() <= endDate.getTime();
    });

    // Se incluyen también los eventos bloqueados y sin DJ conocido en esta etapa:
    // prepareGroup() necesita verlos para saber qué DJs quedan comprometidos ese
    // día (ver comentario ahí). Se descartan recién al preparar cada grupo.
    var groups = {};
    future.forEach(function(e){
      var key = e.date.getFullYear() + '-' + (e.date.getMonth() + 1) + '-' + e.date.getDate() + '|' + e.cityNorm;
      if (!groups[key]) groups[key] = { date: e.date, cityNorm: e.cityNorm, events: [] };
      groups[key].events.push(e);
    });

    return Object.keys(groups).map(function(k){ return groups[k]; });
  }

  // Para cada grupo (fecha+ciudad): DJs activos de esa ciudad (sin hardcodear
  // ninguna) y solo los eventos cuyo DJ actual es uno de esos DJs conocidos — si el
  // DJ asignado en AGENDA no está en la hoja DATA no hay forma de conocer su
  // ubicación para comparar, así que ese evento queda fuera del análisis.
  //
  // Un evento BLOQUEADO (columna R) conserva su DJ actual y no entra al reacomodo,
  // pero ese DJ sigue comprometido ese día: se retira del pool de candidatos
  // disponibles para los demás eventos del mismo día/ciudad, para no recomendarlo
  // en dos lados a la vez.
  function prepareGroup(group){
    var djsInCity = allDjs.filter(function(d){ return d.cityNorm === group.cityNorm; });

    var lockedDjNames = {};
    group.events.forEach(function(e){
      if (e.blocked && e.djNameNorm) lockedDjNames[e.djNameNorm] = true;
    });
    var availableDjs = djsInCity.filter(function(d){ return !lockedDjNames[d.nameNorm]; });

    var eligibleEvents = group.events.filter(function(e){
      if (e.blocked) return false;
      return availableDjs.some(function(d){ return d.nameNorm === e.djNameNorm; });
    });

    if (!eligibleEvents.length || !availableDjs.length) return null;
    return { date: group.date, cityNorm: group.cityNorm, events: eligibleEvents, djs: availableDjs };
  }

  // Distancia (km) de cada evento a cada DJ candidato del grupo, en una sola llamada
  // a OpenRouteService Matrix (nunca una petición por combinación). Si ORS falla
  // (cuota, red, etc.) cae a Haversine calculado localmente, sin red adicional.
  function getGroupDistanceMatrix(events, djs){
    var locations = events.map(function(e){ return [e.lng, e.lat]; })
      .concat(djs.map(function(d){ return [d.lng, d.lat]; }));
    var sources = events.map(function(_, i){ return i; });
    var destinations = djs.map(function(_, i){ return events.length + i; });

    return fetch(ORS_MATRIX_URL, {
      method: 'POST',
      headers: { 'Authorization': ORS_API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ locations: locations, sources: sources, destinations: destinations, metrics: ['distance'] })
    }).then(function(res){
      if (!res.ok) throw new Error('ors_matrix_error');
      return res.json();
    }).then(function(data){
      if (!data.distances) throw new Error('ors_matrix_bad_response');
      var matrix = data.distances.map(function(row){
        return row.map(function(meters){ return meters / 1000; });
      });
      return { matrix: matrix, usedFallback: false };
    }).catch(function(){
      var matrix = events.map(function(e){
        return djs.map(function(d){ return haversineKm(e.lat, e.lng, d.lat, d.lng); });
      });
      return { matrix: matrix, usedFallback: true };
    });
  }

  // Compara la asignación ACTUAL (de AGENDA) contra la óptima (húngaro) para un
  // grupo fecha+ciudad. Solo se recomienda un cambio si el DJ propuesto es
  // distinto del actual Y el ahorro alcanza MIN_REASSIGNMENT_SAVING_KM; si no,
  // se conserva la distancia actual tanto en el total actual como en el optimizado.
  function analyzeGroup(group){
    return getGroupDistanceMatrix(group.events, group.djs).then(function(res){
      var matrix = res.matrix;
      var hungarian = hungarianMinCost(matrix);

      var recs = [];
      var actualTotal = 0;
      var optimizedTotal = 0;

      group.events.forEach(function(e, i){
        var actualDjIdx = group.djs.findIndex(function(d){ return d.nameNorm === e.djNameNorm; });
        var actualDist = matrix[i][actualDjIdx];
        var proposedDjIdx = hungarian.assignment[i];
        var proposedDist = (proposedDjIdx >= 0) ? matrix[i][proposedDjIdx] : actualDist;

        actualTotal += actualDist;

        var saving = actualDist - proposedDist;
        if (proposedDjIdx >= 0 && proposedDjIdx !== actualDjIdx && saving >= MIN_REASSIGNMENT_SAVING_KM){
          optimizedTotal += proposedDist;
          recs.push({
            cityNorm: group.cityNorm,
            date: group.date,
            actualDj: group.djs[actualDjIdx],
            actualDist: actualDist,
            proposedDj: group.djs[proposedDjIdx],
            proposedDist: proposedDist,
            saving: saving
          });
        } else {
          optimizedTotal += actualDist;
        }
      });

      return {
        recs: recs, actualTotal: actualTotal, optimizedTotal: optimizedTotal,
        eventCount: group.events.length, usedFallback: res.usedFallback
      };
    });
  }

  function runOptimizationAnalysis(periodDays){
    var groups = getFutureEventGroups(periodDays).map(prepareGroup).filter(Boolean);

    if (!groups.length){
      return Promise.resolve({ recs: [], actualTotal: 0, optimizedTotal: 0, eventCount: 0, usedFallbackAny: false });
    }

    return Promise.all(groups.map(analyzeGroup)).then(function(results){
      var allRecs = [];
      var actualTotal = 0, optimizedTotal = 0, eventCount = 0, usedFallbackAny = false;
      results.forEach(function(r){
        allRecs = allRecs.concat(r.recs);
        actualTotal += r.actualTotal;
        optimizedTotal += r.optimizedTotal;
        eventCount += r.eventCount;
        if (r.usedFallback) usedFallbackAny = true;
      });
      allRecs.sort(function(a, b){ return b.saving - a.saving; });
      return {
        recs: allRecs, actualTotal: actualTotal, optimizedTotal: optimizedTotal,
        eventCount: eventCount, usedFallbackAny: usedFallbackAny
      };
    });
  }

  var optToolToggle    = document.getElementById('optToolToggle');
  var optToolPanel     = document.getElementById('optToolPanel');
  var optToolClose     = document.getElementById('optToolClose');
  var optPeriodSelector= document.getElementById('optPeriodSelector');
  var optAnalyzeBtn    = document.getElementById('optAnalyzeBtn');
  var optMsgEl         = document.getElementById('optMsg');
  var optSummaryEl     = document.getElementById('optSummary');
  var optResultsEl     = document.getElementById('optResults');
  var optSelectedPeriodDays = 15;

  function setOptMsg(msg, isError){
    optMsgEl.textContent = msg || '';
    optMsgEl.classList.toggle('error', !!isError);
  }

  function renderOptimizationResults(result, periodDays){
    var ahorro = result.actualTotal - result.optimizedTotal;

    optSummaryEl.innerHTML =
      '<div>Periodo: <span class="opt-summary-highlight">Próximos ' + periodDays + ' días</span></div>' +
      '<div>' + result.eventCount + ' evento' + (result.eventCount === 1 ? '' : 's') + ' analizado' + (result.eventCount === 1 ? '' : 's') + '</div>' +
      '<div>Asignación actual: <span class="opt-summary-highlight">' + result.actualTotal.toFixed(1) + ' km</span></div>' +
      '<div>Asignación optimizada: <span class="opt-summary-highlight">' + result.optimizedTotal.toFixed(1) + ' km</span></div>' +
      '<div>Ahorro potencial: <span class="opt-summary-highlight">' + ahorro.toFixed(1) + ' km</span></div>' +
      '<div>Reacomodos recomendados: <span class="opt-summary-highlight">' + result.recs.length + '</span></div>';

    if (!result.recs.length){
      optResultsEl.innerHTML = '<div class="dj-tool-msg">No se encontraron reacomodos con al menos ' + MIN_REASSIGNMENT_SAVING_KM + ' km de ahorro.</div>';
    } else {
      var html = '';
      result.recs.forEach(function(r){
        html +=
          '<div class="opt-rec-row">' +
            '<div class="opt-rec-header">' +
              '<span>' + escapeHtml(CITY_DISPLAY_NAMES[r.cityNorm] || r.cityNorm) + '</span>' +
              '<span>' + formatDateEs(r.date) + '</span>' +
            '</div>' +
            '<div class="opt-rec-swap">' +
              '<span>' + escapeHtml(r.actualDj.name) + '</span>' +
              '<span class="opt-rec-arrow">&rarr;</span>' +
              '<span class="opt-rec-to">' + escapeHtml(r.proposedDj.name) + '</span>' +
            '</div>' +
            '<div class="opt-rec-dist">' + r.actualDist.toFixed(1) + ' km &rarr; ' + r.proposedDist.toFixed(1) + ' km' +
              ' &middot; <span class="opt-rec-saving">ahorro ' + r.saving.toFixed(1) + ' km</span></div>' +
          '</div>';
      });
      optResultsEl.innerHTML = html;
    }

    setOptMsg(result.usedFallbackAny
      ? 'Análisis completo. Algunos días usaron línea recta aproximada (OpenRouteService no disponible en ese momento).'
      : 'Análisis completo — rutas reales por calle (OpenRouteService).');
  }

  function closeOptPanel(){
    optToolPanel.classList.remove('visible');
    optToolToggle.classList.remove('active');
  }

  optToolToggle.addEventListener('click', function(){
    if (optToolPanel.classList.contains('visible')){
      closeOptPanel();
    } else {
      closeDjPanel(); // evita que los dos paneles queden abiertos encimados
      optToolPanel.classList.add('visible');
      optToolToggle.classList.add('active');
    }
  });

  optToolClose.addEventListener('click', closeOptPanel);

  optPeriodSelector.addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn) return;
    setActive(optPeriodSelector, btn);
    optSelectedPeriodDays = parseInt(btn.dataset.days, 10);
  });

  optAnalyzeBtn.addEventListener('click', function(){
    setOptMsg('Actualizando datos de Google Sheets…');
    optSummaryEl.innerHTML = '';
    optResultsEl.innerHTML = '';
    optAnalyzeBtn.disabled = true;
    optAnalyzeBtn.textContent = 'ANALIZANDO…';

    // Siempre jala datos frescos de AGENDA antes de analizar — si no, un cambio
    // recién hecho en Sheets (ej. quitar un BLOQUEADO) no se reflejaría hasta el
    // siguiente refresco automático (cada REFRESH_MS) o un F5 a la página.
    loadEvents().then(function(){
      setOptMsg('Analizando asignaciones futuras…');
      return runOptimizationAnalysis(optSelectedPeriodDays);
    }).then(function(result){
      if (!result.eventCount){
        setOptMsg('No hay eventos futuros con DJ activo conocido en los próximos ' + optSelectedPeriodDays + ' días.', true);
        return;
      }
      renderOptimizationResults(result, optSelectedPeriodDays);
    }).catch(function(err){
      console.error('Error al optimizar asignaciones:', err);
      setOptMsg('Ocurrió un error al analizar las asignaciones. Intenta de nuevo.', true);
    }).then(function(){
      optAnalyzeBtn.disabled = false;
      optAnalyzeBtn.textContent = 'ANALIZAR ASIGNACIONES';
    });
  });

  // ================= CONVERTIR UBICACIÓN: Apple Maps -> Google Maps =================
  // Reutiliza extractCoordinatesFromInput (genérica, no depende de que sea link de
  // Google) y resolveShortMapsLink (el mismo Cloudflare Worker que ya sigue
  // redirecciones para links cortos, tampoco específico de Google) — cero backend
  // nuevo. Solo analiza/convierte: no toca Sheets ni ninguna otra herramienta.

  // Coordenadas de la última conversión exitosa, listas para conectarse más
  // adelante con DJ CERCANO (o cualquier otra herramienta) sin volver a parsear nada.
  var lastConvertedLocation = null;

  // Coordenadas = fuente de verdad de la ubicación exacta; el nombre (si existe)
  // solo se agrega como etiqueta visible. Formato "/place/<nombre>/@lat,lng,17z":
  // es el mismo que genera el propio Google Maps al compartir un lugar (ya lo
  // vimos tal cual en links reales de AGENDA), así que Maps lo interpreta como
  // "centra y marca aquí, mostrando este texto como etiqueta" sin re-buscar el
  // nombre por su cuenta ni mover el pin.
  function generateGoogleMapsLink(point, name){
    if (name){
      // Formato oficial de Google para "Search Action" con nombre + coordenadas
      // como pista: query=Nombre,lat,lng. Google prioriza el lugar más cercano a
      // esas coordenadas que coincida con el nombre; si no encuentra coincidencia
      // exacta, el buscador igual muestra el texto completo (incluyendo el nombre)
      // en la caja de búsqueda y el pin queda junto a las coordenadas indicadas.
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ',' + point.lat + ',' + point.lng);
    }
    return 'https://www.google.com/maps/search/?api=1&query=' + point.lat + ',' + point.lng;
  }

  // Busca un nombre de lugar en los parámetros habituales de un link de mapas,
  // en orden de prioridad (q/name/query = suele ser el nombre real del lugar;
  // address = respaldo, es más una dirección que un nombre). URLSearchParams ya
  // decodifica %XX y "+" como espacio automáticamente — no hace falta
  // decodeURIComponent manual aparte.
  function extractPlaceNameFromMapsUrl(rawUrl){
    var url;
    try {
      url = new URL(rawUrl);
    } catch (e){
      return null; // no es una URL absoluta parseable
    }

    var looksLikeCoords = /^-?\d{1,3}(?:\.\d+)?[\s,]+-?\d{1,3}(?:\.\d+)?$/;
    var candidateParams = ['q', 'name', 'query', 'address'];

    for (var i = 0; i < candidateParams.length; i++){
      var raw = url.searchParams.get(candidateParams[i]);
      if (!raw) continue;
      var val = raw.trim();
      if (val && !looksLikeCoords.test(val)) return val;
    }
    return null;
  }

  var convertToolToggle  = document.getElementById('convertToolToggle');
  var convertModalOverlay= document.getElementById('convertModalOverlay');
  var convertModalClose  = document.getElementById('convertModalClose');
  var convertInput       = document.getElementById('convertInput');
  var convertBtn         = document.getElementById('convertBtn');
  var convertMsgEl       = document.getElementById('convertMsg');
  var convertResultEl    = document.getElementById('convertResult');
  var convertNameFieldEl = document.getElementById('convertNameField');
  var convertNameValueEl = document.getElementById('convertNameValue');
  var convertCoordsValueEl = document.getElementById('convertCoordsValue');
  var convertOutput      = document.getElementById('convertOutput');
  var convertCopyBtn     = document.getElementById('convertCopyBtn');
  var convertOpenBtn     = document.getElementById('convertOpenBtn');

  function setConvertMsg(msg, isError){
    convertMsgEl.textContent = msg || '';
    convertMsgEl.classList.toggle('error', !!isError);
  }

  function openConvertModal(){
    closeDjPanel();
    closeOptPanel();
    convertModalOverlay.classList.add('visible');
    convertToolToggle.classList.add('active');
  }

  function closeConvertModal(){
    convertModalOverlay.classList.remove('visible');
    convertToolToggle.classList.remove('active');
  }

  function finishConvert(point, name){
    lastConvertedLocation = { lat: point.lat, lng: point.lng, name: name || null };

    if (name){
      convertNameValueEl.textContent = name;
      convertNameFieldEl.style.display = '';
    } else {
      convertNameFieldEl.style.display = 'none';
    }
    convertCoordsValueEl.textContent = point.lat.toFixed(6) + ', ' + point.lng.toFixed(6);
    convertOutput.value = generateGoogleMapsLink(point, name);

    convertResultEl.style.display = 'flex';
    setConvertMsg(name ? 'Nombre y coordenadas detectados.' : 'Solo se detectaron coordenadas — el enlace no traía un nombre reconocible.');
  }

  function fallbackCopyToClipboard(text){
    convertOutput.removeAttribute('readonly');
    convertOutput.select();
    try {
      document.execCommand('copy');
      setConvertMsg('Link copiado al portapapeles.');
    } catch (e){
      setConvertMsg('No se pudo copiar automáticamente — selecciona el texto y cópialo manualmente.', true);
    }
    convertOutput.setAttribute('readonly', 'readonly');
  }

  function handleConvert(){
    setConvertMsg('');
    convertResultEl.style.display = 'none';

    var raw = convertInput.value;
    var point = extractCoordinatesFromInput(raw);
    var trimmed = String(raw || '').trim();
    var looksLikeUrl = /^https?:\/\//i.test(trimmed);

    if (point){
      finishConvert(point, looksLikeUrl ? extractPlaceNameFromMapsUrl(trimmed) : null);
      return;
    }

    if (!looksLikeUrl){
      setConvertMsg('No se pudieron extraer coordenadas. Pega un link de Apple Maps o las coordenadas directamente.', true);
      return;
    }

    // Parece un link pero no trae coordenadas visibles: puede ser un link corto de
    // Apple Maps (ej. maps.apple/p/...) — se intenta resolver con el mismo Worker
    // que ya usa DJ CERCANO para links cortos de Google (sigue redirecciones,
    // no es específico de ningún mapa en particular).
    setConvertMsg('Resolviendo enlace…');
    convertBtn.disabled = true;
    convertBtn.textContent = 'RESOLVIENDO…';

    resolveShortMapsLink(trimmed).then(function(finalUrl){
      var resolvedPoint = extractCoordinatesFromInput(finalUrl);
      if (!resolvedPoint){
        setConvertMsg('El enlace no contiene coordenadas reconocibles. Prueba con el link largo de Apple Maps o pega las coordenadas directamente.', true);
        return;
      }
      finishConvert(resolvedPoint, extractPlaceNameFromMapsUrl(finalUrl));
    }).catch(function(err){
      console.error('Fallo al resolver enlace de Apple Maps:', err);
      setConvertMsg('No se pudo resolver el enlace corto automáticamente. Esto puede pasar si el enlace redirige mediante JavaScript en vez de una redirección HTTP directa — una limitación del navegador, no del código. Abre el link en Apple Maps, comparte de nuevo el link largo, o pega las coordenadas directamente.', true);
    }).then(function(){
      convertBtn.disabled = false;
      convertBtn.textContent = 'CONVERTIR';
    });
  }

  convertToolToggle.addEventListener('click', openConvertModal);
  convertModalClose.addEventListener('click', closeConvertModal);
  convertModalOverlay.addEventListener('click', function(ev){
    if (ev.target === convertModalOverlay) closeConvertModal();
  });
  convertBtn.addEventListener('click', handleConvert);
  convertInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') handleConvert();
  });

  convertCopyBtn.addEventListener('click', function(){
    var text = convertOutput.value;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        setConvertMsg('Link copiado al portapapeles.');
      }).catch(function(){
        fallbackCopyToClipboard(text);
      });
    } else {
      fallbackCopyToClipboard(text);
    }
  });

  convertOpenBtn.addEventListener('click', function(){
    if (convertOutput.value) window.open(convertOutput.value, '_blank', 'noopener');
  });

  loadEvents();
  setInterval(loadEvents, REFRESH_MS);

  loadDjs();
  setInterval(loadDjs, REFRESH_MS);

})();
</script>
