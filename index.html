<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NayarSound — Mapa de Eventos</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:      #050a0d;
    --panel:   #0a1216;
    --line:    #142329;
    --cyan:    #00e0ff;
    --blue:    #0a84ff;
    --text:    #eaf6f8;
    --muted:   #5c7a82;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    z-index:1000;
  }

  .row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px 10px;
  }

  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .brand span{ color:var(--cyan); }

  .counter{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .counter-label{
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
  }
  .counter-value{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--cyan);
    text-shadow:0 0 14px rgba(0,224,255,0.35);
    min-width:1.6ch;
    text-align:right;
  }

  .row-controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 20px 12px;
  }

  .segmented{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }

  .segmented button{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    padding:7px 12px;
    cursor:pointer;
    border-right:1px solid var(--line);
    transition:background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button:hover{ color:var(--text); }
  .segmented button.active{
    background:rgba(0,224,255,0.12);
    color:var(--cyan);
  }

  #map{
    flex:1;
    width:100%;
    background:var(--bg);
  }

  .leaflet-control-attribution{
    background:rgba(5,10,13,0.75) !important;
    color:var(--muted) !important;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
  }
  .leaflet-control-attribution a{ color:var(--muted) !important; }
  .leaflet-control-zoom a{
    background:var(--panel) !important;
    color:var(--cyan) !important;
    border-color:var(--line) !important;
  }
  .leaflet-control-zoom a:hover{ background:#0f1c22 !important; }

  /* punto individual */
  .event-marker{
    display:block;
    width:12px;
    height:12px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bdfbff, var(--cyan) 55%, var(--blue) 100%);
    box-shadow:0 0 0 4px rgba(0,224,255,0.15), 0 0 10px rgba(0,224,255,0.55);
  }

  /* cluster personalizado */
  .cluster-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(189,251,255,0.9), rgba(0,224,255,0.85) 60%, rgba(10,132,255,0.85) 100%);
    box-shadow:0 0 0 4px rgba(0,224,255,0.15), 0 0 16px rgba(0,224,255,0.5);
    color:#04141a;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
  }

  /* etiqueta permanente — NIVEL 2, cada una de las 16 subzonas */
  .quad-label{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    color:var(--text);
    text-shadow:0 1px 3px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.8);
    pointer-events:none;
    line-height:1.3;
  }
  .quad-label-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.03em;
    color:var(--cyan);
  }
  .quad-label-count{
    font-size:13px;
    font-weight:700;
  }
  .quad-label-pct{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.01em;
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }

  /* etiqueta permanente — NIVEL 1, los 4 cuadrantes principales */
  .quad-label-name-lg{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.05em;
    color:var(--cyan);
  }
  .quad-label-count-lg{
    font-size:16px;
    font-weight:700;
  }
  .quad-label-pct-lg{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.01em;
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }

  #status{
    position:absolute;
    bottom:12px;
    left:20px;
    font-size:10px;
    letter-spacing:0.05em;
    color:var(--muted);
    background:rgba(5,10,13,0.7);
    padding:5px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    z-index:1000;
  }

  .out-of-zone-label{
    position:absolute;
    bottom:12px;
    right:20px;
    font-size:10px;
    letter-spacing:0.05em;
    color:var(--muted);
    background:rgba(5,10,13,0.7);
    padding:5px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    z-index:1000;
  }

  .quadrant-overlay{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(5,10,13,0.6);
    z-index:900;
    pointer-events:none;
  }
  .quadrant-overlay.visible{ display:flex; }
  .quadrant-overlay-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 22px;
    min-width:220px;
  }
  .quadrant-overlay-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--cyan);
    text-align:center;
    margin-bottom:14px;
  }
  .quadrant-overlay-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    font-size:11px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .quadrant-overlay-row:last-child{ border-bottom:none; }
  .quadrant-overlay-row span:first-child{ color:var(--muted); }
  .quadrant-overlay-row span:last-child{ color:var(--text); font-weight:700; }

  @media (max-width: 640px){
    .row-controls{ justify-content:flex-start; }
  }

  /* ================= HERRAMIENTA: DJ MÁS CERCANO (independiente) ================= */
  .dj-tool-toggle{
    position:absolute;
    top:14px;
    right:16px;
    z-index:1001;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--cyan);
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.05em;
    padding:9px 13px;
    cursor:pointer;
    box-shadow:0 0 12px rgba(0,224,255,0.15);
  }
  .dj-tool-toggle:hover{ background:#0f1c22; }

  .dj-tool-panel{
    position:absolute;
    top:58px;
    right:16px;
    z-index:1001;
    width:290px;
    max-width:calc(100vw - 32px);
    max-height:calc(100vh - 90px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    display:none;
    flex-direction:column;
    gap:10px;
    box-shadow:0 8px 28px rgba(0,0,0,0.55);
  }
  /* El scroll vive solo en .dj-results-wrap: encabezado, fecha, ubicación y botón
     quedan siempre visibles aunque haya muchos DJs en la lista. */
  .dj-tool-panel.visible{ display:flex; }

  .dj-tool-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--cyan);
  }
  .dj-tool-close{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    padding:0 2px;
  }
  .dj-tool-close:hover{ color:var(--text); }

  .dj-tool-label{
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--muted);
  }

  .dj-tool-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:8px 9px;
  }
  .dj-tool-input:focus{ outline:none; border-color:var(--cyan); }

  .dj-tool-search-btn{
    width:100%;
    background:rgba(0,224,255,0.12);
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.05em;
    padding:9px;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .dj-tool-search-btn:hover{ background:rgba(0,224,255,0.22); }
  .dj-tool-search-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .dj-tool-msg{
    font-size:10.5px;
    letter-spacing:0.02em;
    color:var(--muted);
    min-height:13px;
  }
  .dj-tool-msg.error{ color:#ff6b6b; }

  .dj-results-wrap{
    overflow-y:auto;
    max-height:min(48vh, 360px);
    padding-right:2px;
  }
  .dj-results{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .dj-availability-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.04em;
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .dj-availability-badge.busy{
    background:rgba(255,59,59,0.18);
    color:#ff8080;
    border:1px solid rgba(255,59,59,0.55);
  }
  .dj-availability-badge.free{
    background:rgba(46,204,113,0.16);
    color:#4ade80;
    border:1px solid rgba(74,222,128,0.5);
  }
  /* Cada resultado en 2 líneas: 1) rango + nombre (prioridad visual) + badge,
     2) tiempo/distancia con tipografía secundaria. El nombre nunca usa ellipsis. */
  .dj-result-row{
    display:flex;
    flex-direction:column;
    gap:3px;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
    cursor:pointer;
    transition:background 0.12s ease;
  }
  .dj-result-row:hover{ background:rgba(0,224,255,0.08); }
  .dj-result-line1{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dj-result-rank{ color:var(--muted); flex-shrink:0; font-size:11.5px; }
  .dj-result-name{
    flex:1;
    min-width:0;
    font-weight:700;
    font-size:13px;
    color:var(--text);
    overflow-wrap:break-word;
  }
  .dj-result-line2{
    color:var(--muted);
    font-size:10.5px;
    padding-left:20px;
  }
  .dj-result-row.top{
    border-color:#ff3b3b;
    background:rgba(255,59,59,0.10);
    box-shadow:0 0 12px rgba(255,59,59,0.25);
  }
  .dj-result-row.top .dj-result-name{ color:#ff6b6b; }

  .dj-marker{
    display:block;
    width:18px;
    height:18px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a8a, #ff3b3b 55%, #b30000 100%);
    border:2.5px solid #ffffff;
    box-shadow:0 1px 4px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,59,59,0.35);
  }
  .dj-marker-top{
    display:block;
    width:26px;
    height:26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a8a, #ff3b3b 55%, #8f0000 100%);
    border:3px solid #ffffff;
    box-shadow:0 2px 6px rgba(0,0,0,0.7), 0 0 0 3px rgba(255,59,59,0.5);
  }
  .event-location-marker{
    display:block;
    width:28px;
    height:28px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffbe0, #ffd23b 55%, #cc9900 100%);
    border:3px solid #0a1216;
    box-shadow:0 2px 8px rgba(0,0,0,0.7), 0 0 0 3px rgba(255,210,59,0.45);
  }

  @media (max-width: 640px){
    .dj-tool-panel{ width:290px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="row-top">
      <div class="brand">NAYAR<span>SOUND</span></div>
      <div class="counter">
        <span class="counter-label" id="counterLabel">EVENTOS REGISTRADOS:</span>
        <span class="counter-value" id="counterValue">—</span>
      </div>
    </div>
    <div class="row-controls">
      <div class="segmented" id="viewSelector">
        <button data-view="points" class="active">PUNTOS</button>
        <button data-view="quadrants">CUADRANTES</button>
      </div>
      <div class="segmented" id="citySelector">
        <button data-city="TODOS" class="active">TODOS</button>
        <button data-city="TEPIC">TEPIC</button>
        <button data-city="GUADALAJARA">GUADALAJARA</button>
        <button data-city="LEON">LEÓN</button>
        <button data-city="QUERETARO" id="queretaroBtn" style="display:none;">QUERÉTARO</button>
      </div>
      <div class="segmented" id="periodSelector">
        <button data-period="GLOBAL" class="active">GLOBAL</button>
        <button data-period="2026">2026</button>
        <button data-period="2025">2025</button>
        <button data-period="90D">ÚLTIMOS 90 DÍAS</button>
      </div>
    </div>
  </header>
  <div id="map"></div>
  <div id="quadrantOverlay" class="quadrant-overlay"></div>
  <div id="outOfZoneLabel" class="out-of-zone-label" style="display:none;"></div>
  <div id="status">Cargando datos…</div>

  <!-- ===== Herramienta independiente: DJ más cercano ===== -->
  <button id="djToolToggle" class="dj-tool-toggle" type="button">DJ CERCANO</button>
  <div id="djToolPanel" class="dj-tool-panel">
    <div class="dj-tool-header">
      <span>ASIGNACIÓN DE DJ</span>
      <button id="djToolClose" class="dj-tool-close" type="button" aria-label="Cerrar">&times;</button>
    </div>
    <div id="djLoadStatus" class="dj-tool-msg">Cargando DJs…</div>
    <label class="dj-tool-label" for="djDateInput">FECHA DEL EVENTO</label>
    <input id="djDateInput" class="dj-tool-input" type="text" placeholder="8 SEPTIEMBRE" autocomplete="off">
    <label class="dj-tool-label" for="djLocationInput">UBICACIÓN DEL EVENTO</label>
    <input id="djLocationInput" class="dj-tool-input" type="text" placeholder="Pega coordenadas o link de Google Maps" autocomplete="off">
    <button id="djSearchBtn" class="dj-tool-search-btn" type="button">BUSCAR DJ MÁS CERCANO</button>
    <div id="djSearchMsg" class="dj-tool-msg"></div>
    <div class="dj-results-wrap"><div id="djResults" class="dj-results"></div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
(function(){

  // ================= CONFIGURACIÓN =================
  var SHEET_ID    = '1FKaobilQ1HNHXntMxnFgoPld5In4dwSNsQgt-78yk4o';
  var SHEET_NAME  = 'AGENDA';
  var DATA_RANGE  = 'C13:Q5000'; // columna C (CIUDAD) ... columna Q (COORDENADAS)
  var CITY_COL_IDX  = 0;  // C es la primera columna del rango
  var DJ_ASSIGNED_COL_IDX = 1; // D (DJ) — DJ asignado al evento, usado por OCUPADO/DISPONIBLE
  var FECHA_COL_IDX = 2;  // E (FECHA) está 2 columnas después de C — solo se usa para filtrar, nunca se muestra
  var COORD_COL_IDX = 14; // Q está 14 columnas después de C
  var REFRESH_MS  = 5 * 60 * 1000;

  // ---- Fuente de DJs para la herramienta "DJ más cercano" (100% dinámica desde Sheets) ----
  // Pestaña "DATA" del mismo spreadsheet. Datos desde la fila 3, columnas P/Q/R:
  // P = CIUDAD, Q = NOMBRE, R = COORDENADAS. No existe columna de estado: todo DJ
  // cargado en esas columnas se considera activo. Agregar/quitar DJs o ciudades
  // nuevas ahí no requiere tocar este código.
  var DJS_SHEET_ID   = SHEET_ID;
  var DJS_SHEET_NAME = 'DATA';
  var DJS_RANGE      = 'P3:R5000';
  var DJ_CITY_COL_IDX  = 0; // P
  var DJ_NAME_COL_IDX  = 1; // Q
  var DJ_COORD_COL_IDX = 2; // R

  var statusEl  = document.getElementById('status');
  var counterEl = document.getElementById('counterValue');
  var counterLabelEl = document.getElementById('counterLabel');
  var quadrantOverlayEl = document.getElementById('quadrantOverlay');
  var outOfZoneEl = document.getElementById('outOfZoneLabel');
  function setStatus(msg){ statusEl.textContent = msg; }

  // ================= MAPA BASE (100% gratis, sin API key) =================
  var map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    center: [21.3, -104.2],
    zoom: 8
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    subdomains: 'abc',
    maxZoom: 19
  }).addTo(map);

  var eventDivIcon = L.divIcon({
    className: '',
    html: '<span class="event-marker"></span>',
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });

  var djDivIcon = L.divIcon({
    className: '',
    html: '<span class="dj-marker"></span>',
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });

  var djTopDivIcon = L.divIcon({
    className: '',
    html: '<span class="dj-marker-top"></span>',
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });

  var eventLocationDivIcon = L.divIcon({
    className: '',
    html: '<span class="event-location-marker"></span>',
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });

  function createClusterIcon(cluster){
    var count = cluster.getChildCount();
    var size = count < 10 ? 34 : (count < 50 ? 44 : 56);
    var fontSize = count < 100 ? 13 : 11;
    return L.divIcon({
      html: '<div class="cluster-inner" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fontSize + 'px;">' + count + '</div>',
      className: '',
      iconSize: L.point(size, size)
    });
  }

  // ================= ESTADO =================
  var allEvents = [];  // [{lat, lng, cityNorm}]
  var currentView = 'points';
  var currentCityFilter = 'TODOS';
  var currentCityDisplay = 'TODOS';
  var currentPeriodFilter = 'GLOBAL';
  var clusterGroup = null;
  var quadrantLayerGroup = null;
  var quadrantCityData = null;   // datos calculados (counts/insideTotal/outCount/zoneBounds) de la ciudad en vista
  var quadrantBaseZoom = null;   // zoom en el que la zona urbana completa cabe en pantalla (nivel 1)
  var quadrantCurrentLevel = null; // 4 o 16 — nivel actualmente dibujado, evita redibujos innecesarios
  var ZOOM_STEPS_FOR_SUBDIVISION = 2; // cuántos niveles de zoom hay que acercarse para pasar a las 16 subzonas

  // ---- Estado de la herramienta independiente "DJ más cercano" ----
  var allDjs = [];        // [{name, cityNorm, lat, lng}] — solo DJs ACTIVO/SI
  var djLayerGroup = null; // capa propia, nunca tocada por clearLayers() de PUNTOS/CUADRANTES

  // Zona urbana FIJA por ciudad: centro + bounding box en km, totalmente independiente
  // de dónde estén los eventos. Esto evita que localidades lejanas (San Blas, Compostela,
  // Santiago Ixcuintla, etc.) deformen o agranden los cuadrantes.
  var KM_PER_DEGREE_LAT = 111.32;

  var CITY_ZONES_RAW = {
    TEPIC:       { center: { lat: 21.5041, lng: -104.8946 }, halfWidthKm: 8,  halfHeightKm: 8  },
    GUADALAJARA: { center: { lat: 20.6597, lng: -103.3496 }, halfWidthKm: 20, halfHeightKm: 20 },
    LEON:        { center: { lat: 21.1250, lng: -101.6860 }, halfWidthKm: 15, halfHeightKm: 15 },
    QUERETARO:   { center: { lat: 20.5888, lng: -100.3899 }, halfWidthKm: 15, halfHeightKm: 15 }
  };

  var CITY_DISPLAY_NAMES = {
    TEPIC: 'TEPIC',
    GUADALAJARA: 'GUADALAJARA',
    LEON: 'LEÓN',
    QUERETARO: 'QUERÉTARO'
  };

  function buildZoneBounds(zone){
    var latHalfDeg = zone.halfHeightKm / KM_PER_DEGREE_LAT;
    var lngHalfDeg = zone.halfWidthKm / (KM_PER_DEGREE_LAT * Math.cos(zone.center.lat * Math.PI / 180));
    return {
      center: zone.center,
      south: zone.center.lat - latHalfDeg,
      north: zone.center.lat + latHalfDeg,
      west:  zone.center.lng - lngHalfDeg,
      east:  zone.center.lng + lngHalfDeg
    };
  }

  var CITY_ZONE_BOUNDS = {};
  Object.keys(CITY_ZONES_RAW).forEach(function(key){
    CITY_ZONE_BOUNDS[key] = buildZoneBounds(CITY_ZONES_RAW[key]);
  });

  var QUADRANT_LABELS = {
    NW: 'NOROESTE',
    NE: 'NORESTE',
    SW: 'SUROESTE',
    SE: 'SURESTE'
  };

  function normalizeCity(s){
    return String(s || '')
      .toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  // Interpreta el valor interno de fecha que entrega Google Sheets (Date(YYYY,MM,DD)).
  // Este valor jamás se muestra: solo se usa para el filtro de periodo.
  function parseSheetDate(cell){
    if (!cell || cell.v == null) return null;
    var raw = cell.v;
    if (typeof raw === 'string'){
      var m = raw.match(/^Date\((\d+),(\d+),(\d+)/);
      if (m){
        var year = parseInt(m[1], 10);
        var month = parseInt(m[2], 10); // viene en base 0
        var day = parseInt(m[3], 10);
        return new Date(year, month, day);
      }
    }
    return null;
  }

  function matchesPeriod(event){
    if (currentPeriodFilter === 'GLOBAL') return true;
    if (!event.date) return false;

    if (currentPeriodFilter === '2026') return event.date.getFullYear() === 2026;
    if (currentPeriodFilter === '2025') return event.date.getFullYear() === 2025;

    if (currentPeriodFilter === '90D'){
      var now = new Date();
      var cutoff = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
      return event.date >= cutoff && event.date <= now;
    }

    return true;
  }

  function parseCoordinate(raw){
    if (!raw) return null;
    var parts = String(raw).split(',');
    if (parts.length !== 2) return null;

    var lat = parseFloat(parts[0].trim());
    var lng = parseFloat(parts[1].trim());

    if (isNaN(lat) || isNaN(lng)) return null;
    if (lat < -90 || lat > 90) return null;
    if (lng < -180 || lng > 180) return null;

    return { lat: lat, lng: lng };
  }

  // ================= UTILIDADES: HERRAMIENTA "DJ MÁS CERCANO" =================

  // Acepta coordenadas sueltas ("20.6736,-103.344") o cualquier link de Google Maps
  // que contenga las coordenadas en su URL (@lat,lng / q=lat,lng / ll=lat,lng, etc.).
  // Los links acortados (goo.gl/maps, maps.app.goo.gl) no exponen coordenadas en el
  // texto de la URL, así que no pueden resolverse sin backend: en ese caso no hay match.
  function extractCoordinatesFromInput(raw){
    if (!raw) return null;
    var text = String(raw).trim();
    if (!text) return null;

    // Algunas URLs (ej. la página de verificación "sorry" de Google) traen la
    // ubicación real percent-encoded dentro de un parámetro (usan "%2B" en vez de
    // un "+" literal). Se decodifica primero para que el "+" quede visible; si el
    // texto no es un URI válido, se sigue con el texto original tal cual.
    try {
      text = decodeURIComponent(text);
    } catch (e){
      // no decodificable — se usa el texto sin decodificar
    }

    var match = text.match(/(-?\d{1,3}(?:\.\d+)?)[\s+]*,[\s+]*(-?\d{1,3}(?:\.\d+)?)/);
    if (!match){
      // Respaldo: algunos links de Google Maps a un negocio/lugar (no a un pin suelto)
      // no traen "@lat,lng" sino el formato interno "...!3d<lat>!4d<lng>..." dentro
      // de la misma URL, que apunta al marcador exacto.
      match = text.match(/!3d(-?\d{1,3}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/);
    }
    if (!match) return null;

    var lat = parseFloat(match[1]);
    var lng = parseFloat(match[2]);
    if (isNaN(lat) || isNaN(lng)) return null;
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;

    return { lat: lat, lng: lng };
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Distancia geográfica en km entre dos puntos (fórmula Haversine).
  function haversineKm(lat1, lng1, lat2, lng2){
    var R = 6371;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  // Reutiliza las zonas urbanas fijas ya definidas para PUNTOS/CUADRANTES (CITY_ZONE_BOUNDS).
  // Si el evento cae claramente dentro de una de esas zonas, se prioriza esa ciudad;
  // si no, o si es una ciudad nueva que aún no tiene zona definida, se devuelve null
  // y la búsqueda se hace contra todos los DJs activos — sin tocar código.
  function detectCityForPoint(lat, lng){
    var keys = Object.keys(CITY_ZONE_BOUNDS);
    for (var i = 0; i < keys.length; i++){
      var b = CITY_ZONE_BOUNDS[keys[i]];
      if (lat >= b.south && lat <= b.north && lng >= b.west && lng <= b.east){
        return keys[i];
      }
    }
    return null;
  }

  // ================= DISPONIBILIDAD DE DJ (OCUPADO/DISPONIBLE) =================

  var MONTH_NAMES_ES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO',
    'AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

  // Interpreta fecha en texto natural en español: "8 SEPTIEMBRE", "8 de septiembre",
  // "8 septiembre 2027", etc. Si no se escribe año, se asume el año actual (el del
  // reloj del navegador en el momento de la búsqueda, no uno fijo en el código).
  // Se arma la fecha con new Date(año, mes, día) — construcción 100% LOCAL, nunca
  // se parsea un string de fecha con new Date(texto) (eso interpreta como UTC
  // medianoche y en México puede correr el día al anterior). Al final se verifica
  // que el día/mes realmente existan (rechaza cosas como "31 de febrero"): si JS
  // "recorrió" la fecha internamente, los componentes ya no coinciden con lo pedido.
  function parseNaturalSpanishDate(raw){
    if (!raw) return null;

    var text = normalizeCity(raw)      // mayúsculas + sin acentos + trim (reutilizado)
      .replace(/\bDE\b/g, ' ')         // ignora la palabra "DE": "8 DE SEPTIEMBRE" -> "8  SEPTIEMBRE"
      .replace(/\s+/g, ' ')            // colapsa espacios repetidos
      .trim();

    var match = text.match(/^(\d{1,2})\s+([A-Z]+)(?:\s+(\d{4}))?$/);
    if (!match) return null;

    var day = parseInt(match[1], 10);
    var monthIdx = MONTH_NAMES_ES.indexOf(match[2]);
    if (monthIdx === -1) return null;

    var year = match[3] ? parseInt(match[3], 10) : new Date().getFullYear();

    var date = new Date(year, monthIdx, day);
    if (date.getFullYear() !== year || date.getMonth() !== monthIdx || date.getDate() !== day){
      return null; // fecha inexistente (ej. 31 de febrero, 32 de septiembre)
    }
    return date;
  }

  // Compara solo año/mes/día en LOCAL (nunca UTC) — mismo criterio que ya usa
  // matchesPeriod() para los filtros de periodo, así que la fecha del evento
  // (parseSheetDate) y la del texto ingresado (parseNaturalSpanishDate) son
  // comparables tal cual, por componentes de calendario.
  function isSameLocalDate(a, b){
    return !!a && !!b &&
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  // Disponibilidad por DÍA COMPLETO: si el DJ tiene cualquier evento ese día ya
  // cargado en memoria desde AGENDA (allEvents), está OCUPADO. Reutiliza los datos
  // ya cargados — no hace ninguna consulta nueva a Google Sheets por DJ.
  function isDjBusyOnDate(djNameNorm, selectedDate){
    return allEvents.some(function(e){
      return e.djNameNorm && e.djNameNorm === djNameNorm && isSameLocalDate(e.date, selectedDate);
    });
  }

  function updateQueretaroVisibility(){
    var hasQueretaro = allEvents.some(function(e){ return e.cityNorm === 'QUERETARO'; });
    var btn = document.getElementById('queretaroBtn');
    btn.style.display = hasQueretaro ? '' : 'none';

    if (!hasQueretaro && currentCityFilter === 'QUERETARO'){
      currentCityFilter = 'TODOS';
      currentCityDisplay = 'TODOS';
      setActive(document.getElementById('citySelector'), document.querySelector('#citySelector [data-city="TODOS"]'));
    }
  }

  // ================= CARGA DE DATOS (JSONP, evita el bloqueo CORS de Sheets) =================
  function loadEvents(){
    var callbackName = '__gvizCallback_' + Date.now();
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?sheet=' + encodeURIComponent(SHEET_NAME) +
              '&range=' + DATA_RANGE + '&headers=0' +
              '&tqx=out:json;responseHandler:' + callbackName;

    var script = document.createElement('script');
    var settled = false;

    var timeoutId = setTimeout(function(){
      if (settled) return;
      settled = true;
      cleanup();
      console.error('Tiempo de espera agotado al cargar Google Sheets');
      setStatus('No se pudo actualizar — reintentando…');
    }, 10000);

    function cleanup(){
      clearTimeout(timeoutId);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(json){
      if (settled) return;
      settled = true;
      cleanup();

      try {
        var rows = (json.table && json.table.rows) ? json.table.rows : [];
        var events = [];

        rows.forEach(function(row){
          var cells = row.c || [];
          var cityRaw  = cells[CITY_COL_IDX]  ? cells[CITY_COL_IDX].v  : null;
          var djRaw    = cells[DJ_ASSIGNED_COL_IDX] ? cells[DJ_ASSIGNED_COL_IDX].v : null;
          var coordRaw = cells[COORD_COL_IDX] ? cells[COORD_COL_IDX].v : null;
          var eventDate = parseSheetDate(cells[FECHA_COL_IDX]);
          var coord = parseCoordinate(coordRaw);
          if (!coord) return;

          events.push({
            lat: coord.lat,
            lng: coord.lng,
            cityNorm: normalizeCity(cityRaw),
            date: eventDate,
            djNameNorm: normalizeCity(djRaw) // usado por OCUPADO/DISPONIBLE en DJ CERCANO
          });
        });

        allEvents = events;
        updateQueretaroVisibility();
        renderCurrentView();
        setStatus('Actualizado ' + new Date().toLocaleTimeString('es-MX'));
      } catch (err){
        console.error('Error al procesar datos de Google Sheets:', err);
        setStatus('No se pudo actualizar — reintentando…');
      }
    };

    script.onerror = function(){
      if (settled) return;
      settled = true;
      cleanup();
      console.error('Error al cargar el script de Google Sheets');
      setStatus('No se pudo actualizar — reintentando…');
    };

    script.src = url;
    document.body.appendChild(script);
  }

  // ================= CARGA DE DJs (independiente, misma técnica JSONP) =================

  // ================= RENDER =================
  function clearLayers(){
    if (clusterGroup){ map.removeLayer(clusterGroup); clusterGroup = null; }
    if (quadrantLayerGroup){ map.removeLayer(quadrantLayerGroup); quadrantLayerGroup = null; }
  }

  function renderPoints(events){
    clusterGroup = L.markerClusterGroup({
      iconCreateFunction: createClusterIcon,
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      maxClusterRadius: 60
    });

    events.forEach(function(e){
      clusterGroup.addLayer(L.marker([e.lat, e.lng], { icon: eventDivIcon, interactive: false }));
    });

    clusterGroup.addTo(map);
  }

  // Lista de las 16 subzonas: cada uno de los 4 cuadrantes principales (NW/NE/SW/SE)
  // dividido en una matriz interna 2x2 (1=sup-izq, 2=sup-der, 3=inf-izq, 4=inf-der).
  var SUBQUADRANT_KEYS = [];
  ['NW', 'NE', 'SW', 'SE'].forEach(function(m){
    for (var i = 1; i <= 4; i++) SUBQUADRANT_KEYS.push(m + i);
  });

  function quadrantRectBounds(zoneBounds, qKey){
    var b = zoneBounds;
    var c = zoneBounds.center;
    if (qKey === 'NW') return [[c.lat, b.west], [b.north, c.lng]];
    if (qKey === 'NE') return [[c.lat, c.lng], [b.north, b.east]];
    if (qKey === 'SW') return [[b.south, b.west], [c.lat, c.lng]];
    return [[b.south, c.lng], [c.lat, b.east]]; // SE
  }

  function subQuadrantRectBounds(zoneBounds, mainKey, subNum){
    var mBounds = quadrantRectBounds(zoneBounds, mainKey);
    var latMin = mBounds[0][0], lngMin = mBounds[0][1];
    var latMax = mBounds[1][0], lngMax = mBounds[1][1];
    var midLat = (latMin + latMax) / 2;
    var midLng = (lngMin + lngMax) / 2;

    if (subNum === 1) return [[midLat, lngMin], [latMax, midLng]]; // superior-izquierda
    if (subNum === 2) return [[midLat, midLng], [latMax, lngMax]]; // superior-derecha
    if (subNum === 3) return [[latMin, lngMin], [midLat, midLng]]; // inferior-izquierda
    return [[latMin, midLng], [midLat, lngMax]]; // 4: inferior-derecha
  }

  // Clasifica un evento contra la zona urbana FIJA de su ciudad.
  // Devuelve 'OUT' si cae fuera del bounding box definido (no altera los cuadrantes),
  // o una de las 16 claves de subzona (p. ej. "SW3").
  function classifyEvent(event, zoneBounds){
    if (event.lat < zoneBounds.south || event.lat > zoneBounds.north ||
        event.lng < zoneBounds.west  || event.lng > zoneBounds.east){
      return 'OUT';
    }

    var c = zoneBounds.center;
    var mainKey = (event.lat >= c.lat)
      ? (event.lng < c.lng ? 'NW' : 'NE')
      : (event.lng < c.lng ? 'SW' : 'SE');

    var mBounds = quadrantRectBounds(zoneBounds, mainKey);
    var latMin = mBounds[0][0], lngMin = mBounds[0][1];
    var latMax = mBounds[1][0], lngMax = mBounds[1][1];
    var midLat = (latMin + latMax) / 2;
    var midLng = (lngMin + lngMax) / 2;

    var subNum = (event.lat >= midLat)
      ? (event.lng < midLng ? 1 : 2)
      : (event.lng < midLng ? 3 : 4);

    return mainKey + subNum;
  }

  function computeCityQuadrants(cityKey, cityEvents){
    var zoneBounds = CITY_ZONE_BOUNDS[cityKey];
    if (!zoneBounds) return null;

    var counts = {};
    SUBQUADRANT_KEYS.forEach(function(k){ counts[k] = 0; });
    var outCount = 0;

    cityEvents.forEach(function(e){
      var q = classifyEvent(e, zoneBounds);
      if (q === 'OUT') outCount++;
      else counts[q]++;
    });

    var insideTotal = SUBQUADRANT_KEYS.reduce(function(sum, k){ return sum + counts[k]; }, 0);

    return {
      cityKey: cityKey,
      zoneBounds: zoneBounds,
      counts: counts,
      insideTotal: insideTotal, // base para los % (sin "fuera de zona")
      outCount: outCount
    };
  }

  function sumSubcounts(cityData, mainKey){
    return cityData.counts[mainKey + '1'] + cityData.counts[mainKey + '2'] +
           cityData.counts[mainKey + '3'] + cityData.counts[mainKey + '4'];
  }

  // NIVEL 1 — vista general: un rectángulo por cada uno de los 4 cuadrantes principales.
  function drawMainQuadrant(cityData, mainKey, maxCount){
    var rectBounds = quadrantRectBounds(cityData.zoneBounds, mainKey);
    var count = sumSubcounts(cityData, mainKey);
    var percentage = cityData.insideTotal > 0 ? (count / cityData.insideTotal * 100) : 0;
    var intensity = maxCount > 0 ? (count / maxCount) : 0;
    var fillOpacity = 0.10 + intensity * 0.65;

    var rect = L.rectangle(rectBounds, {
      color: '#00e0ff',
      weight: 1,
      opacity: 0.4,
      fillColor: '#00e0ff',
      fillOpacity: fillOpacity,
      interactive: false
    });
    quadrantLayerGroup.addLayer(rect);

    var center = L.latLngBounds(rectBounds).getCenter();
    var label = L.marker(center, {
      icon: L.divIcon({
        className: '',
        html:
          '<div class="quad-label">' +
            '<div class="quad-label-name-lg">' + QUADRANT_LABELS[mainKey] + '</div>' +
            '<div class="quad-label-count-lg">' + count + ' EVENTOS</div>' +
            '<div class="quad-label-pct-lg">' + percentage.toFixed(0) + '% DEL TOTAL DE LA CIUDAD</div>' +
          '</div>',
        iconSize: [160, 68],
        iconAnchor: [80, 34]
      }),
      interactive: false
    });
    quadrantLayerGroup.addLayer(label);
  }

  // NIVEL 2 — al hacer zoom: cada cuadrante principal subdividido en sus 4 subzonas.
  function drawSubQuadrant(cityData, key, maxCount){
    var mainKey = key.slice(0, 2);
    var subNum = parseInt(key.slice(2), 10);
    var rectBounds = subQuadrantRectBounds(cityData.zoneBounds, mainKey, subNum);
    var count = cityData.counts[key];
    var percentage = cityData.insideTotal > 0 ? (count / cityData.insideTotal * 100) : 0;
    var intensity = maxCount > 0 ? (count / maxCount) : 0;
    var fillOpacity = 0.10 + intensity * 0.65; // más eventos = mayor intensidad visual

    var rect = L.rectangle(rectBounds, {
      color: '#00e0ff',
      weight: 1,
      opacity: 0.35,
      fillColor: '#00e0ff',
      fillOpacity: fillOpacity,
      interactive: false
    });
    quadrantLayerGroup.addLayer(rect);

    var center = L.latLngBounds(rectBounds).getCenter();
    var label = L.marker(center, {
      icon: L.divIcon({
        className: '',
        html:
          '<div class="quad-label">' +
            '<div class="quad-label-name">' + QUADRANT_LABELS[mainKey] + ' ' + subNum + '</div>' +
            '<div class="quad-label-count">' + count + ' EVENTOS</div>' +
            '<div class="quad-label-pct">' + percentage.toFixed(1) + '% DEL TOTAL DE LA CIUDAD</div>' +
          '</div>',
        iconSize: [120, 56],
        iconAnchor: [60, 28]
      }),
      interactive: false
    });
    quadrantLayerGroup.addLayer(label);
  }

  // Línea vertical + horizontal marcando los 4 cuadrantes principales,
  // para conservar la lectura simple NOROESTE/NORESTE/SUROESTE/SURESTE
  // en ambos niveles.
  function drawMainCross(zoneBounds){
    var vLine = L.polyline(
      [[zoneBounds.south, zoneBounds.center.lng], [zoneBounds.north, zoneBounds.center.lng]],
      { color: '#00e0ff', weight: 2, opacity: 0.65, interactive: false }
    );
    var hLine = L.polyline(
      [[zoneBounds.center.lat, zoneBounds.west], [zoneBounds.center.lat, zoneBounds.east]],
      { color: '#00e0ff', weight: 2, opacity: 0.65, interactive: false }
    );
    quadrantLayerGroup.addLayer(vLine);
    quadrantLayerGroup.addLayer(hLine);
  }

  // Decide, según el zoom actual del mapa, si toca dibujar el nivel 1 (4 zonas)
  // o el nivel 2 (16 subzonas), y solo redibuja si el nivel realmente cambió.
  function drawQuadrantLayerForCurrentZoom(){
    if (!quadrantCityData) return;

    var threshold = quadrantBaseZoom + ZOOM_STEPS_FOR_SUBDIVISION;
    var level = (map.getZoom() >= threshold) ? 16 : 4;

    if (level === quadrantCurrentLevel && quadrantLayerGroup) return;

    if (quadrantLayerGroup){ map.removeLayer(quadrantLayerGroup); }
    quadrantLayerGroup = L.layerGroup();

    if (level === 4){
      var maxCount4 = Math.max(
        sumSubcounts(quadrantCityData, 'NW'),
        sumSubcounts(quadrantCityData, 'NE'),
        sumSubcounts(quadrantCityData, 'SW'),
        sumSubcounts(quadrantCityData, 'SE')
      );
      ['NW', 'NE', 'SW', 'SE'].forEach(function(m){
        drawMainQuadrant(quadrantCityData, m, maxCount4);
      });
    } else {
      var maxCount16 = 0;
      SUBQUADRANT_KEYS.forEach(function(k){ maxCount16 = Math.max(maxCount16, quadrantCityData.counts[k]); });
      SUBQUADRANT_KEYS.forEach(function(k){
        drawSubQuadrant(quadrantCityData, k, maxCount16);
      });
    }

    drawMainCross(quadrantCityData.zoneBounds);
    quadrantLayerGroup.addTo(map);
    quadrantCurrentLevel = level;
  }

  map.on('zoomend', function(){
    if (currentView === 'quadrants' && currentCityFilter !== 'TODOS'){
      drawQuadrantLayerForCurrentZoom();
    }
  });

  function cityHasAnyData(cityKey){
    return allEvents.some(function(e){ return e.cityNorm === cityKey; });
  }

  function showTodosOverlay(events){
    var rows = Object.keys(CITY_ZONE_BOUNDS)
      .filter(function(cityKey){ return cityHasAnyData(cityKey); })
      .map(function(cityKey){
        var count = events.filter(function(e){ return e.cityNorm === cityKey; }).length;
        return { name: CITY_DISPLAY_NAMES[cityKey] || cityKey, count: count };
      })
      .sort(function(a, b){ return b.count - a.count; });

    var html = '<div class="quadrant-overlay-card">' +
      '<div class="quadrant-overlay-title">SELECCIONA UNA CIUDAD PARA VER SUS CUADRANTES</div>';

    rows.forEach(function(r){
      html += '<div class="quadrant-overlay-row"><span>' + r.name + '</span><span>' + r.count + ' EVENTOS</span></div>';
    });

    html += '</div>';
    quadrantOverlayEl.innerHTML = html;
    quadrantOverlayEl.classList.add('visible');
  }

  function hideTodosOverlay(){
    quadrantOverlayEl.classList.remove('visible');
  }

  function showOutOfZoneLabel(count){
    outOfZoneEl.textContent = 'FUERA DE ZONA: ' + count + ' EVENTOS';
    outOfZoneEl.style.display = 'block';
  }

  function hideOutOfZoneLabel(){
    outOfZoneEl.style.display = 'none';
  }

  // ---- Modo enfoque de DJ CERCANO: oculta temporalmente eventos/clusters/cuadrantes ----
  // sin destruirlos (solo se desprenden del mapa con removeLayer; los mismos objetos
  // se vuelven a adjuntar al salir, o se recrean con la lógica normal si el usuario
  // cambia de vista/filtro mientras el modo está activo).
  var djModeActive = false;

  function applyDjFocusVisibility(){
    if (!djModeActive) return;
    if (clusterGroup && map.hasLayer(clusterGroup)) map.removeLayer(clusterGroup);
    if (quadrantLayerGroup && map.hasLayer(quadrantLayerGroup)) map.removeLayer(quadrantLayerGroup);
    hideTodosOverlay();
    hideOutOfZoneLabel();
  }

  function enterDjFocusMode(){
    if (djModeActive) return;
    djModeActive = true;
    applyDjFocusVisibility();
  }

  function exitDjFocusMode(){
    if (!djModeActive) return;
    djModeActive = false;
    if (djLayerGroup){ map.removeLayer(djLayerGroup); djLayerGroup = null; }
    // renderCurrentView() refleja el filtro de ciudad/periodo y la vista actuales
    // (aunque hayan cambiado durante la búsqueda de DJ), restaurando el mapa normal
    // sin necesidad de recordar un estado previo por separado.
    renderCurrentView();
  }

  function renderQuadrants(events){
    quadrantCityData = null;
    quadrantCurrentLevel = null;

    // TODOS: no se dibujan cuadrantes superpuestos de varias ciudades — se pide elegir una.
    if (currentCityFilter === 'TODOS'){
      showTodosOverlay(events);
      return;
    }

    var zoneBounds = CITY_ZONE_BOUNDS[currentCityFilter];
    if (!zoneBounds) return; // ciudad sin zona urbana definida (no debería ocurrir)

    var data = computeCityQuadrants(currentCityFilter, events);
    if (!data) return;

    quadrantCityData = data;
    showOutOfZoneLabel(data.outCount);

    // El mapa se ajusta a la zona urbana FIJA, nunca a la ubicación de los eventos.
    // Ese zoom resultante se vuelve la referencia del NIVEL 1 (4 cuadrantes).
    var boundsLatLng = L.latLngBounds([[zoneBounds.south, zoneBounds.west], [zoneBounds.north, zoneBounds.east]]);
    quadrantBaseZoom = map.getBoundsZoom(boundsLatLng, false, [30, 30]);
    map.fitBounds(boundsLatLng, { padding: [30, 30] });

    // Por si el zoom no cambia (fitBounds no dispara "zoomend"), forzamos el primer dibujo.
    drawQuadrantLayerForCurrentZoom();
  }

  function getFilteredEvents(){
    return allEvents.filter(function(e){
      var cityOk = (currentCityFilter === 'TODOS') || (e.cityNorm === currentCityFilter);
      return cityOk && matchesPeriod(e);
    });
  }

  function fitToEvents(events){
    if (!events.length) return;
    var bounds = L.latLngBounds(events.map(function(e){ return [e.lat, e.lng]; }));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
  }

  function updateCounterDisplay(count){
    if (currentCityFilter === 'TODOS'){
      counterLabelEl.textContent = 'EVENTOS REGISTRADOS:';
      counterEl.textContent = count;
    } else {
      counterLabelEl.textContent = currentCityDisplay + ':';
      counterEl.textContent = count + ' EVENTOS';
    }
  }

  function renderCurrentView(){
    var events = getFilteredEvents();
    updateCounterDisplay(events.length);

    clearLayers();
    hideTodosOverlay();
    hideOutOfZoneLabel();

    if (currentView === 'points'){
      renderPoints(events);
      fitToEvents(events);
    } else {
      renderQuadrants(events); // ajusta el mapa por sí misma (a la zona fija o deja el overlay de TODOS)
    }

    applyDjFocusVisibility();
  }

  function setActive(container, target){
    Array.prototype.forEach.call(container.querySelectorAll('button'), function(btn){
      btn.classList.toggle('active', btn === target);
    });
  }

  document.getElementById('viewSelector').addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn) return;
    setActive(this, btn);
    currentView = btn.dataset.view;
    renderCurrentView();
  });

  document.getElementById('citySelector').addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn) return;
    setActive(this, btn);
    currentCityFilter = btn.dataset.city;
    currentCityDisplay = btn.textContent.trim();
    renderCurrentView();
  });

  document.getElementById('periodSelector').addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn) return;
    setActive(this, btn);
    currentPeriodFilter = btn.dataset.period;
    renderCurrentView();
  });

  // ================= HERRAMIENTA INDEPENDIENTE: DJ MÁS CERCANO =================
  // No participa de clearLayers()/renderCurrentView(): tiene su propia capa (djLayerGroup)
  // y no altera vistas, filtros, clustering, contador ni la lógica de FUERA DE ZONA.

  // Ruteo real por calle (OpenRouteService, gratis) en vez de línea recta.
  // ORS_MAX_DESTINATIONS acota cuántos DJs se mandan a calcular ruta real por
  // búsqueda (el preorden rápido por línea recta ya deja a los más cercanos primero),
  // para no gastar la cuota gratuita en pools enormes multi-ciudad.
  var ORS_API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6Ijg1Yzg5ZWExNGU4ZDQzMjI5OGFiYjk4ZjkyNGYxNzI3IiwiaCI6Im11cm11cjY0In0=';
  var ORS_MATRIX_URL     = 'https://api.openrouteservice.org/v2/matrix/driving-car';
  var ORS_DIRECTIONS_URL = 'https://api.openrouteservice.org/v2/directions/driving-car';
  var ORS_MAX_DESTINATIONS = 50;

  // Distancia y tiempo reales por calle de un punto a varios DJs, en una sola llamada.
  function getDrivingMatrix(point, djs){
    var locations = [[point.lng, point.lat]].concat(djs.map(function(d){ return [d.lng, d.lat]; }));
    var destinations = djs.map(function(_, i){ return i + 1; });

    return fetch(ORS_MATRIX_URL, {
      method: 'POST',
      headers: {
        'Authorization': ORS_API_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        locations: locations,
        sources: [0],
        destinations: destinations,
        metrics: ['distance', 'duration']
      })
    }).then(function(res){
      if (!res.ok) throw new Error('ors_matrix_error');
      return res.json();
    }).then(function(data){
      var distances = data.distances && data.distances[0];
      var durations = data.durations && data.durations[0];
      if (!distances || !durations) throw new Error('ors_matrix_bad_response');
      djs.forEach(function(dj, i){
        dj.distanceKm  = distances[i] != null ? distances[i] / 1000 : null;
        dj.durationMin = durations[i] != null ? durations[i] / 60 : null;
      });
      return djs;
    });
  }

  // Geometría de la ruta real (por calle) entre dos puntos, para dibujarla en el mapa.
  function getDrivingRoute(pointA, pointB){
    var url = ORS_DIRECTIONS_URL +
      '?api_key=' + encodeURIComponent(ORS_API_KEY) +
      '&start=' + pointA.lng + ',' + pointA.lat +
      '&end=' + pointB.lng + ',' + pointB.lat;

    return fetch(url).then(function(res){
      if (!res.ok) throw new Error('ors_directions_error');
      return res.json();
    }).then(function(geojson){
      var coords = geojson && geojson.features && geojson.features[0] &&
                   geojson.features[0].geometry && geojson.features[0].geometry.coordinates;
      if (!coords || !coords.length) throw new Error('ors_directions_bad_response');
      return coords.map(function(c){ return [c[1], c[0]]; }); // [lng,lat] -> [lat,lng] (Leaflet)
    });
  }

  var djToolToggle   = document.getElementById('djToolToggle');
  var djToolPanel    = document.getElementById('djToolPanel');
  var djToolClose    = document.getElementById('djToolClose');
  var djDateInput    = document.getElementById('djDateInput');
  var djLocationInput= document.getElementById('djLocationInput');
  var djSearchBtn    = document.getElementById('djSearchBtn');
  var djSearchMsgEl  = document.getElementById('djSearchMsg');
  var djResultsEl    = document.getElementById('djResults');
  var currentDjSearch = null; // { point, pool, rankedDjs } — para poder re-trazar la ruta al elegir otro DJ de la lista

  function setDjSearchMsg(msg, isError){
    djSearchMsgEl.textContent = msg || '';
    djSearchMsgEl.classList.toggle('error', !!isError);
  }

  function djResultLabel(dj){
    var dist = (dj.distanceKm != null) ? dj.distanceKm.toFixed(1) + ' km' : '';
    if (dj.durationMin != null){
      var mins = Math.round(dj.durationMin) + ' min';
      return dist ? (mins + ' · ' + dist) : mins;
    }
    return dist || '—';
  }

  // selectedDj: cuál DJ se resalta/traza en el mapa. No cambia el ranking (el orden
  // sigue siendo por cercanía/ruta) — solo cuál está marcado como elegido. Por
  // defecto es el más cercano (rankedDjs[0]).
  function renderDjResults(rankedDjs, selectedDj){
    if (!rankedDjs.length){
      djResultsEl.innerHTML = '';
      return;
    }
    var html = '';
    rankedDjs.forEach(function(dj, idx){
      var isSelected = selectedDj ? (dj === selectedDj) : (idx === 0);
      var badgeClass = dj.busy ? 'busy' : 'free';
      var badgeText  = dj.busy ? 'OCUPADO' : 'DISPONIBLE';
      html += '<div class="dj-result-row' + (isSelected ? ' top' : '') + '" data-dj-index="' + idx + '">' +
                '<div class="dj-result-line1">' +
                  '<span class="dj-result-rank">' + (idx + 1) + '.</span>' +
                  '<span class="dj-result-name">' + escapeHtml(dj.name) + '</span>' +
                  '<span class="dj-availability-badge ' + badgeClass + '">' + badgeText + '</span>' +
                '</div>' +
                '<div class="dj-result-line2">' + djResultLabel(dj) + '</div>' +
              '</div>';
    });
    djResultsEl.innerHTML = html;
  }

  function drawDjSearchOnMap(point, pool, rankedDjs, routeLatLngs, selectedDj){
    enterDjFocusMode();

    if (djLayerGroup){ map.removeLayer(djLayerGroup); djLayerGroup = null; }
    djLayerGroup = L.layerGroup();

    var nearest = selectedDj || (rankedDjs.length ? rankedDjs[0] : null);

    if (nearest){
      if (routeLatLngs && routeLatLngs.length > 1){
        // Outline discreto oscuro debajo para que el cian resalte sobre el mapa claro.
        L.polyline(routeLatLngs, {
          color: '#04141a', weight: 6, opacity: 0.35, interactive: false
        }).addTo(djLayerGroup);
        L.polyline(routeLatLngs, {
          color: '#00e0ff', weight: 3, opacity: 0.95, interactive: false
        }).addTo(djLayerGroup);
      } else {
        L.polyline([[point.lat, point.lng], [nearest.lat, nearest.lng]], {
          color: '#00e0ff', weight: 2, opacity: 0.8, dashArray: '6,6', interactive: false
        }).addTo(djLayerGroup);
      }
    }

    // Resto de DJs primero (prioridad visual media), destacados después (alta/máxima)
    // para que queden por encima en el mismo pane de marcadores.
    function djPopupText(dj){
      var status = dj.busy ? 'OCUPADO' : 'DISPONIBLE';
      return escapeHtml(dj.name) + ' — ' + status + ' — ' + djResultLabel(dj);
    }

    pool.forEach(function(dj){
      if (dj === nearest) return;
      L.marker([dj.lat, dj.lng], { icon: djDivIcon })
        .bindPopup(djPopupText(dj))
        .addTo(djLayerGroup);
    });

    if (nearest){
      L.marker([nearest.lat, nearest.lng], { icon: djTopDivIcon, zIndexOffset: 900 })
        .bindPopup(djPopupText(nearest))
        .addTo(djLayerGroup);
    }

    L.marker([point.lat, point.lng], { icon: eventLocationDivIcon, zIndexOffset: 1000 })
      .bindPopup('UBICACIÓN DEL EVENTO')
      .addTo(djLayerGroup);

    djLayerGroup.addTo(map);

    var fitPoints = [[point.lat, point.lng]];
    rankedDjs.forEach(function(dj){ fitPoints.push([dj.lat, dj.lng]); });
    if (routeLatLngs) fitPoints = fitPoints.concat(routeLatLngs);
    if (fitPoints.length > 1){
      map.fitBounds(L.latLngBounds(fitPoints), { padding: [60, 60], maxZoom: 14 });
    } else {
      map.setView([point.lat, point.lng], 13);
    }
  }

  // Resuelve links cortos de Google Maps (maps.app.goo.gl, goo.gl/maps) que no traen
  // coordenadas en el texto de la URL. No hay forma de seguir esa redirección desde el
  // navegador por las restricciones de CORS de Google, así que se usa un proxy público
  // (allorigins.win) que sigue la redirección y devuelve la URL final ya con las
  // coordenadas. Es un "mejor esfuerzo": si el proxy falla, se le pide al usuario el
  // link largo o las coordenadas directas.
  // Mini-servidor propio (Cloudflare Worker, gratis) dedicado a seguir la redirección
  // de links cortos de Google Maps. Los proxys públicos gratuitos (allorigins, r.jina.ai)
  // resultaron inestables; este endpoint es propio y confiable para este uso.
  var LINK_RESOLVER_URL = 'https://nayarsound-resolver.osvaldoh096.workers.dev/';

  function resolveShortMapsLink(url){
    var resolverUrl = LINK_RESOLVER_URL + '?url=' + encodeURIComponent(url);
    return fetch(resolverUrl).then(function(res){
      if (!res.ok) throw new Error('resolver_error');
      return res.json();
    }).then(function(data){
      if (!data || !data.finalUrl) throw new Error('no_final_url');
      return data.finalUrl;
    });
  }

  function handleDjSearch(){
    setDjSearchMsg('');
    djResultsEl.innerHTML = '';

    // FECHA y UBICACIÓN son obligatorias: no se ejecuta la búsqueda si falta alguna
    // o si la fecha escrita no es interpretable/no existe en el calendario.
    var selectedDate = parseNaturalSpanishDate(djDateInput.value);
    if (!selectedDate){
      setDjSearchMsg('Fecha no válida. Ejemplo: 8 SEPTIEMBRE o 8 SEPTIEMBRE 2027', true);
      return;
    }

    var raw = djLocationInput.value;
    var point = extractCoordinatesFromInput(raw);

    if (point){
      runDjSearch(point, selectedDate);
      return;
    }

    var trimmed = String(raw || '').trim();
    if (!/^https?:\/\//i.test(trimmed)){
      setDjSearchMsg('No se pudieron extraer coordenadas válidas. Pega "lat,lng" o un link de Google Maps que las incluya.', true);
      return;
    }

    // Parece un link pero no trae coordenadas visibles: puede ser un link corto — se intenta resolver.
    setDjSearchMsg('Resolviendo enlace…');
    djSearchBtn.disabled = true;
    djSearchBtn.textContent = 'RESOLVIENDO ENLACE…';

    resolveShortMapsLink(trimmed).then(function(finalUrl){
      var resolvedPoint = extractCoordinatesFromInput(finalUrl);
      if (!resolvedPoint){
        setDjSearchMsg('El enlace no contiene coordenadas reconocibles. Prueba con el link largo de Google Maps o pega las coordenadas directamente.', true);
        return;
      }
      return runDjSearch(resolvedPoint, selectedDate);
    }).catch(function(){
      setDjSearchMsg('No se pudo resolver el enlace corto automáticamente. Abre el link en el navegador y pega el link largo, o pega las coordenadas directamente.', true);
    }).then(function(){
      djSearchBtn.disabled = false;
      djSearchBtn.textContent = 'BUSCAR DJ MÁS CERCANO';
    });
  }

  function runDjSearch(point, selectedDate){
    if (!allDjs.length){
      djResultsEl.innerHTML = '';
      setDjSearchMsg('Aún no hay DJs activos cargados desde Google Sheets.', true);
      return;
    }

    var cityKey = detectCityForPoint(point.lat, point.lng);
    var pool = cityKey ? allDjs.filter(function(d){ return d.cityNorm === cityKey; }) : allDjs.slice();
    var broadened = false;
    if (cityKey && !pool.length){
      pool = allDjs.slice();
      broadened = true;
    }

    if (!pool.length){
      djResultsEl.innerHTML = '';
      setDjSearchMsg('No hay DJs activos disponibles.', true);
      return;
    }

    var cityMsg;
    if (cityKey && !broadened){
      cityMsg = 'Ciudad detectada: ' + (CITY_DISPLAY_NAMES[cityKey] || cityKey) + '.';
    } else if (cityKey && broadened){
      cityMsg = 'Ciudad detectada (' + (CITY_DISPLAY_NAMES[cityKey] || cityKey) + ') sin DJs registrados — comparando contra todos los activos.';
    } else {
      cityMsg = 'Ciudad no determinada — comparando contra todos los DJs activos.';
    }

    // Preorden rápido por línea recta: acota el pool a un tamaño razonable antes de
    // gastar cuota en calcular rutas reales (esto no cambia el resultado final salvo
    // en pools enormes multi-ciudad, donde igual los más lejanos no iban a ganar).
    pool.forEach(function(dj){ dj.distanceKm = haversineKm(point.lat, point.lng, dj.lat, dj.lng); dj.durationMin = null; });
    pool.sort(function(a, b){ return a.distanceKm - b.distanceKm; });
    var routingCandidates = pool.slice(0, ORS_MAX_DESTINATIONS);

    setDjSearchMsg(cityMsg + ' Calculando ruta real por calle…');
    djSearchBtn.disabled = true;
    djSearchBtn.textContent = 'CALCULANDO RUTA…';

    return getDrivingMatrix(point, routingCandidates).then(function(routedDjs){
      routedDjs.sort(function(a, b){
        var da = (a.durationMin != null) ? a.durationMin : Infinity;
        var db = (b.durationMin != null) ? b.durationMin : Infinity;
        return da - db;
      });
      // OCUPADO/DISPONIBLE es solo información — no afecta el orden, que sigue siendo
      // por cercanía/ruta real ya calculada arriba.
      routedDjs.forEach(function(dj){ dj.busy = isDjBusyOnDate(dj.nameNorm, selectedDate); });

      var rankedDjs = routedDjs; // sin límite: se muestran TODOS los DJs activos de la ciudad
      currentDjSearch = { point: point, pool: routingCandidates, rankedDjs: rankedDjs };
      setDjSearchMsg(cityMsg + ' Ruta real por calle (OpenRouteService).');
      renderDjResults(rankedDjs);

      if (!rankedDjs.length){
        drawDjSearchOnMap(point, routingCandidates, rankedDjs, null);
        return;
      }

      return getDrivingRoute(point, rankedDjs[0]).then(function(routeLatLngs){
        drawDjSearchOnMap(point, routingCandidates, rankedDjs, routeLatLngs);
      }).catch(function(){
        drawDjSearchOnMap(point, routingCandidates, rankedDjs, null);
      });
    }).catch(function(){
      // Respaldo si OpenRouteService falla (cuota, red, etc.): línea recta, avisando.
      // También sin límite — se mantiene el mismo criterio de mostrar todos.
      var rankedDjs = routingCandidates;
      rankedDjs.forEach(function(dj){ dj.busy = isDjBusyOnDate(dj.nameNorm, selectedDate); });
      currentDjSearch = { point: point, pool: routingCandidates, rankedDjs: rankedDjs };
      setDjSearchMsg(cityMsg + ' No se pudo calcular la ruta real — mostrando línea recta aproximada.', true);
      renderDjResults(rankedDjs);
      drawDjSearchOnMap(point, routingCandidates, rankedDjs, null);
    }).then(function(){
      djSearchBtn.disabled = false;
      djSearchBtn.textContent = 'BUSCAR DJ MÁS CERCANO';
    });
  }

  // Elegir otro DJ de la lista (sin cambiar el ranking): re-dibuja el mapa marcándolo
  // como el DJ destacado y recalcula/traza su ruta real, reutilizando exactamente la
  // misma lógica de renderDjResults/drawDjSearchOnMap/getDrivingRoute que ya existía.
  function selectDjForRoute(dj){
    if (!currentDjSearch) return;

    renderDjResults(currentDjSearch.rankedDjs, dj);
    drawDjSearchOnMap(currentDjSearch.point, currentDjSearch.pool, currentDjSearch.rankedDjs, null, dj);

    getDrivingRoute(currentDjSearch.point, dj).then(function(routeLatLngs){
      if (!currentDjSearch) return; // el panel pudo cerrarse mientras se esperaba la ruta
      drawDjSearchOnMap(currentDjSearch.point, currentDjSearch.pool, currentDjSearch.rankedDjs, routeLatLngs, dj);
    }).catch(function(){
      // se queda con la línea recta ya dibujada como respaldo
    });
  }

  djResultsEl.addEventListener('click', function(ev){
    var row = ev.target.closest('.dj-result-row');
    if (!row || !currentDjSearch) return;
    var idx = parseInt(row.dataset.djIndex, 10);
    var dj = currentDjSearch.rankedDjs[idx];
    if (!dj) return;
    selectDjForRoute(dj);
  });

  function closeDjPanel(){
    djToolPanel.classList.remove('visible');
    exitDjFocusMode();
    currentDjSearch = null;
    djResultsEl.innerHTML = '';
    setDjSearchMsg('');
  }

  djToolToggle.addEventListener('click', function(){
    if (djToolPanel.classList.contains('visible')){
      closeDjPanel();
    } else {
      djToolPanel.classList.add('visible');
    }
  });

  djToolClose.addEventListener('click', closeDjPanel);

  djSearchBtn.addEventListener('click', handleDjSearch);

  djLocationInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') handleDjSearch();
  });

  loadEvents();
  setInterval(loadEvents, REFRESH_MS);

  loadDjs();
  setInterval(loadDjs, REFRESH_MS);

})();
</script>
